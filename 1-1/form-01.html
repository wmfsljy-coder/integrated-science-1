<script>
/* 형성평가 — 통합과학1 Ⅰ-1 01 SI 기본단위(단위와 환산 · 기본량과 유도량 · 켈빈 온도 · 자연 상수로 정한 기준). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅰ-1 과학의 기본량", part: "01 SI 기본단위",
  std: ["10통과1-01-01", "10통과1-01-02"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 7,
      q: "다음 중 SI 기본량이 아닌 것은?",
      opts: ["길이", "질량", "속력", "물질량", "광도"],
      a: 2, why: "SI 기본량은 길이·질량·시간·전류·온도·물질량·광도의 일곱 가지입니다. 속력은 길이 ÷ 시간으로 만든 유도량(m/s)입니다." },
    { lv: "기본", type: "short", ref: 9, unit: "K",
      q: "물이 끓는 온도 100 ℃를 켈빈 온도로 나타내면 몇 K일까요?",
      a: ["373.15", "373.15 K", "373.15K"], why: "켈빈 온도 = 섭씨온도 + 273.15이므로 100 + 273.15 = 373.15 K입니다. 두 눈금은 간격이 같고 시작점만 다릅니다." },
    { lv: "기본", type: "mc", ref: 12,
      q: "오늘날 SI 단위를 정하는 방법으로 옳은 것은?",
      opts: ["1 m는 파리 금고에 보관한 금속 막대의 길이로 정한다",
             "1 s는 지구가 한 번 자전하는 데 걸리는 시간을 86,400으로 나누어 정한다",
             "1 kg은 2019년부터 플랑크 상수의 값을 고정해 정한다",
             "1 K는 물이 어는 온도를 0으로 놓고 정한다"],
      a: 2, why: "2019년에 킬로그램은 130년 동안 쓰던 금속 원기 대신 플랑크 상수로 다시 정의되었습니다. 1 m는 빛이 진공에서 1/299,792,458초 동안 간 거리, 1 s는 세슘-133 원자의 진동으로 정하고, 0 K는 절대 영도입니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "1999년 화성 기후 궤도선 사고에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 지상 팀은 충격량을 파운드힘초(lbf·s)로 내보냈고, 항법 팀은 같은 숫자를 뉴턴초(N·s)로 읽었다.<br>ㄴ. 항법 팀은 실제보다 약 4.45배 큰 충격량이 작용했다고 계산했다.<br>ㄷ. 넘겨받은 숫자에 4.448222를 곱해 넣었다면 단원 화면 모형에서 예정 고도 226 km 근처로 진입한다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "1 lbf = 4.448222 N이므로 lbf로 적은 숫자를 N으로 읽으면 실제보다 약 4.45배 ‘작은’ 충격량으로 계산하게 됩니다(ㄴ 틀림). 모형에서 고도 = 8 + 49 × 계수이므로 계수 4.448222를 쓰면 약 226 km가 됩니다." },
    { lv: "발전", type: "short", ref: 5, unit: "N",
      q: "같은 힘을 두 저울로 재었더니 파운드힘 저울이 5.0 lbf를 가리켰습니다. 뉴턴 저울은 약 몇 N을 가리킬까요? (1 lbf = 4.448222 N, 소수 첫째 자리에서 반올림해 정수로)",
      a: ["22", "약 22", "22 N"], why: "5.0 × 4.448222 = 22.24… ≈ 22 N입니다. lbf를 N으로 바꿀 때는 환산 계수를 곱합니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "유도량과 그 단위를 SI 기본단위로 바르게 짝지은 것은?",
      opts: ["넓이 — m³", "속력 — m·s", "밀도 — kg/m³", "힘 — kg·m/s"],
      a: 2, why: "밀도 = 질량 ÷ 부피이므로 kg/m³입니다. 넓이는 m², 속력은 m/s, 힘(N)은 kg·m/s²입니다." },
    { lv: "심화", type: "mc", ref: 9,
      q: "어떤 기체의 온도를 20 ℃에서 40 ℃로 올렸습니다. 이에 대한 설명으로 옳은 것은?",
      opts: ["켈빈 온도도 두 배가 되었다",
             "켈빈 온도로는 20 K 올랐다",
             "켈빈 온도로는 293.15 K에서 333.15 K로 올랐다",
             "0 ℃가 가장 낮은 온도이므로 켈빈 온도도 0에서 시작한다"],
      a: 1, why: "20 ℃ = 293.15 K, 40 ℃ = 313.15 K입니다. 섭씨가 두 배가 되어도 켈빈 온도는 두 배가 아니며, 눈금 간격이 같으므로 오른 폭은 20 K입니다. 가장 낮은 온도는 0 ℃가 아니라 절대 영도(0 K = −273.15 ℃)입니다." },
    { lv: "심화", type: "essay", ref: 12,
      q: "1 kg의 기준이 ‘금고 속 금속 원기’에서 ‘플랑크 상수’로 바뀌었습니다. 기준을 물건 대신 자연 상수로 정하면 무엇이 좋은지 쓰고, 화성 기후 궤도선 사고와 관련지어 단위의 기준이 왜 모두에게 같아야 하는지 설명하세요.",
      model: "물건은 하나뿐이고 시간이 지나면 변할 수 있지만, 자연 상수는 언제 어디서 재도 같아서 누구나 같은 기준을 다시 만들 수 있다. 화성 기후 궤도선은 두 팀이 서로 다른 단위(lbf·s와 N·s)로 같은 숫자를 읽어 궤도가 어긋났으므로, 모두가 같은 기준의 같은 단위를 써야 같은 숫자가 같은 양을 뜻하게 된다.",
      rubric: ["물건은 변하거나 하나뿐이지만 자연 상수는 어디서나 같다는 점을 썼다", "두 팀이 다른 단위로 같은 숫자를 읽은 사고를 연결했다", "같은 기준이어야 같은 숫자가 같은 양을 뜻한다고 설명했다"] }
  ]
};
