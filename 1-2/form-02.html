/* 형성평가 — 통합과학1 Ⅰ-2 02 측정 표준의 유용성(미터원기와 열팽창 · 표준이 없던 시장 · 자연 상수와 SI). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅰ-2 과학의 측정과 우리 사회", part: "02 측정 표준의 유용성",
  std: ["10통과1-01-03"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 6,
      q: "미터원기처럼 ‘물건’을 길이의 기준으로 삼을 때의 문제점이 <b>아닌</b> 것은?",
      opts: ["온도에 따라 길이가 조금씩 변한다",
             "세상에 하나뿐이라 잃어버리면 되찾을 수 없다",
             "오래 쓰면 닳거나 오염될 수 있다",
             "누구나 언제 어디서든 같은 방법으로 다시 만들 수 있다"],
      a: 3, why: "언제 어디서든 같은 방법으로 다시 만들 수 있다는 것은 물건이 아니라 자연 상수에 매인 기준의 장점입니다. 물건 기준은 열팽창, 닳음·오염, 분실의 위험이 있습니다." },
    { lv: "기본", type: "short", ref: 8,
      q: "같은 “스물다섯 뼘”이 사람마다 300 cm도 되고 450 cm도 되는 혼란을 막으려면, 서로 다른 사람의 측정을 같은 기준 위에 올려놓는 약속이 필요합니다. 이 약속을 무엇이라고 할까요?",
      a: ["측정 표준", "측정표준", "표준"], why: "측정 표준이 있어야 누가 재도 같은 값을 뜻하게 되어 거래가 공정하고 실험 결과를 견줄 수 있습니다." },
    { lv: "기본", type: "mc", ref: 12,
      q: "2019년, 1889년부터 쓰던 국제 킬로그램 원기를 대신해 1 kg을 정의하는 데 쓰이게 된 것은?",
      opts: ["빛의 속력", "플랑크 상수", "세슘-133 원자의 진동수", "물 1 L의 질량"],
      a: 1, why: "2019년부터 1 kg은 플랑크 상수로 정의합니다. 빛의 속력은 1 m, 세슘-133의 진동수는 1 초의 기준입니다. 이로써 SI의 일곱 기본단위가 모두 자연 상수에 묶였습니다." },
    { lv: "발전", type: "short", ref: 5, unit: "µm",
      q: "선팽창 계수가 8.7 × 10⁻⁶ /℃인 1 m 금속 막대를 0 ℃에서 30 ℃로 데우면 길이가 몇 µm 늘어날까요?",
      a: ["261", "261µm", "약261"], why: "늘어난 길이 = 1 m × 8.7 × 10⁻⁶ /℃ × 30 ℃ = 2.61 × 10⁻⁴ m = 261 µm입니다. 1 ℃마다 8.7 µm씩이므로 8.7 × 30으로 계산해도 됩니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "손이 12 cm인 상인이 천을 재고 “서른 뼘”이라고 말했습니다. 손이 15 cm인 손님이 이 말을 자기 뼘으로 받아들일 때, 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 실제 천의 길이는 360 cm이다.<br>ㄴ. 손님은 실제보다 90 cm 더 긴 천을 산다고 믿는다.<br>ㄷ. 두 사람 모두 미터자로 재면 떠올리는 길이의 차이가 0이 된다.",

      a: 4, why: "실제 천은 12 cm × 30 = 360 cm, 손님이 떠올리는 길이는 15 cm × 30 = 450 cm로 90 cm 더 깁니다. 같은 표준(미터자)으로 재면 두 사람 모두 360 cm를 떠올려 차이가 0이 됩니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "빛(약 3억 m/s)이 진공에서 10 ns(10억분의 10초) 동안 가는 거리로 가장 가까운 것은?",
      opts: ["약 3 cm", "약 30 cm", "약 3 m", "약 300 m"],
      a: 2, why: "299,792,458 m/s × 10 × 10⁻⁹ s ≈ 3.0 m입니다. 빛은 1 ns 동안 약 30 cm를 가므로 10 ns면 약 3 m입니다." },
    { lv: "심화", type: "mc", ref: 10,
      q: "1983년 1 m의 정의를 ‘빛이 진공에서 1/299,792,458 초 동안 간 거리’로 바꾼 일에 대한 설명으로 옳은 것은?",
      opts: ["이 재정의로 1 m의 길이가 이전보다 눈에 띄게 짧아졌다",
             "1 m의 길이는 사실상 그대로이고, 1 m를 정의하는 방법이 바뀌었다",
             "이제 1 m를 정확히 재려면 파리 금고의 미터원기와 견주어야 한다",
             "빛의 속력은 해마다 다시 재어 1 m의 길이를 고쳐 나간다"],
      a: 1, why: "재정의는 길이를 바꾼 것이 아니라 기준을 물건에서 자연 상수(빛의 속력)로 옮긴 것입니다. 빛의 속력은 정확한 값으로 못 박았으므로 다시 재어 고치지 않고, 금고를 열 필요도 없습니다." },
    { lv: "심화", type: "essay", ref: 8,
      q: "한 연구소가 자기 연구소에 있는 금속 추 하나를 ‘1 kg’의 기준으로 삼아 여러 해 동안 측정해 왔습니다. 이 기준의 문제점을 두 가지 들고, 2019년 질량의 기준이 바뀐 방향을 근거로 좋은 측정 표준이 갖춰야 할 조건을 설명하세요.",
      model: "금속 추는 오래 쓰면 닳거나 오염되어 기준 자체가 조금씩 변하므로 해마다 잰 값을 서로 견줄 수 없다. 또 그 연구소에만 있는 하나뿐인 물건이라 다른 연구소의 측정과 비교할 수 없고, 잃어버리면 기준이 사라진다. 2019년에는 국제 킬로그램 원기 대신 플랑크 상수로 1 kg을 정의했다. 따라서 좋은 측정 표준은 시간이 지나도 변하지 않고, 누구나 언제 어디서든 같은 방법으로 다시 만들 수 있어 서로 다른 사람의 측정을 같은 기준 위에 올려놓을 수 있어야 한다.",
      rubric: ["물건 기준의 문제점(닳음·오염·열팽창·분실·하나뿐임 등)을 두 가지 들었다", "2019년 플랑크 상수(자연 상수)로의 변화를 근거로 들었다", "변하지 않음·어디서나 다시 만들 수 있음·비교 가능성 등 좋은 표준의 조건을 설명했다"] }
  ]
