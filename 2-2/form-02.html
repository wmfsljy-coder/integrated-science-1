window.FORMATIVE = {

  items: [

      opts: ["염소가 나트륨에게 전자 1개를 준다", "나트륨이 염소에게 전자 1개를 주어 Na⁺와 Cl⁻가 된다", "나트륨과 염소가 전자쌍 하나를 나눠 쓴다", "나트륨이 전자 7개를 받아 바깥 껍질을 채운다"],

    { lv: "기본", type: "short", ref: 7,
      q: "물 분자에서 산소와 수소는 서로 전자를 하나씩 내놓아 전자쌍을 만들고 그것을 같이 씁니다. 이런 결합을 무엇이라고 할까요?",
      a: ["공유 결합", "공유결합"], why: "비금속 원소끼리는 전자를 주고받지 않고 전자쌍을 나눠 쓰는 공유 결합을 합니다. 산소는 8개, 수소는 2개를 채워 안정해집니다." },
    { lv: "기본", type: "mc", ref: 9,

      opts: ["구리", "설탕", "염화 나트륨", "물"],

      rubric: ["구리에서 전하를 나르는 것이 자유 전자라고 썼다", "고체 염화 나트륨의 이온이 제자리에 묶여 움직이지 못한다고 썼다", "‘움직일 수 있는 전하’가 있어야 전기가 통한다는 기준으로 두 물질을 비교했다"] }
