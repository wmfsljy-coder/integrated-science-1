window.FORMATIVE = {

  items: [
    { lv: "기본", type: "mc", ref: 6,
      q: "4,500,000을 과학적 표기법에 맞게 쓴 것은?",
      opts: ["45 × 10⁵", "0.45 × 10⁷", "4.5 × 10⁶", "450 × 10⁴"],
      a: 2, why: "넷 다 같은 값이지만 계수가 1 이상 10 미만인 것은 4.5 × 10⁶뿐입니다. 소수점을 왼쪽으로 6칸 옮기면 지수는 6입니다." },
    { lv: "기본", type: "short", ref: 5, unit: "m",
      q: "어느 세포의 지름 0.00052 m를 과학적 표기법(A × 10ⁿ, 1 ≤ A < 10)으로 쓰세요.",
      a: ["5.2×10⁻⁴", "5.2×10^-4", "5.2x10^-4", "5.2*10^-4", "5.2×10^(-4)", "5.2e-4"],

    { lv: "기본", type: "mc", ref: 7,
      q: "물질량 1 mol에 대한 설명으로 옳은 것은?",
      opts: ["입자 6.02×10²³ 개의 모임이다",
             "질량 1 g을 뜻한다",
             "부피 1 L를 뜻한다",
             "어떤 물질이든 1 mol의 질량은 18.0 g이다"],
      a: 0, why: "1 mol은 입자 6.02×10²³ 개(아보가드로수)의 묶음입니다. 1 mol의 질량은 물질마다 다르며, 18.0 g은 물 1 mol의 질량입니다." },
    { lv: "발전", type: "short", ref: 8, unit: "개",
      q: "물 90 g에 들어 있는 물 분자는 몇 개일까요? (물 1 mol = 18.0 g, 아보가드로수 6.0×10²³, 과학적 표기법으로)",
      a: ["3.0×10²⁴", "3×10²⁴", "3.0×10^24", "3×10^24", "3.0x10^24", "3x10^24", "3.0*10^24", "3.0e24", "3e24"],
      why: "90 ÷ 18.0 = 5.0 mol, 5.0 × 6.0×10²³ = 30×10²³ = 3.0×10²⁴ 개입니다. 계수가 10을 넘으면 계수를 10으로 나누고 지수를 1 올립니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "한 사람 몸의 세포가 약 3.7×10¹³ 개일 때, 20명의 세포를 모두 더한 수를 과학적 표기법으로 바르게 나타낸 것은?",

    { lv: "발전", type: "mc", ref: 10,

    { lv: "심화", type: "mc", ref: 8,
      q: "(5.0 × 10⁶) × (4.0 × 10⁻²)를 계산해 과학적 표기법으로 나타낸 것은?",
      opts: ["20 × 10⁴", "2.0 × 10⁵", "2.0 × 10⁻¹²", "9.0 × 10⁴"],
      a: 1, why: "계수끼리 곱하면 5.0 × 4.0 = 20, 지수끼리 더하면 6 + (−2) = 4 → 20 × 10⁴. 계수가 10을 넘으므로 2.0 × 10⁵로 고칩니다. 지수를 곱하면 10⁻¹², 계수를 더하면 9.0이 되는 실수에 주의합니다." },
    { lv: "심화", type: "essay", ref: 10,
      q: "‘150 × 10⁹ m’, ‘1.50 × 10¹¹ m’, ‘0.15 × 10¹² m’는 모두 지구에서 태양까지의 거리를 나타낸 같은 값입니다. 이 가운데 과학적 표기법에 맞는 것을 고르고, 계수를 1 이상 10 미만으로 정해 두면 좋은 점을 두 가지 설명하세요.",
      model: "1.50 × 10¹¹ m가 맞다. 계수를 1 이상 10 미만으로 정해 두면 한 수를 쓰는 방법이 하나로 정해져, 지수만 보고도 두 값의 크기를 바로 비교할 수 있다. 또 계수에 적힌 숫자(1.50)가 믿을 만한 자리, 곧 유효숫자 세 자리를 분명하게 드러낸다.",
      rubric: ["1.50 × 10¹¹ m를 골랐다", "표기가 하나로 정해져 지수로 크기를 비교하기 쉽다는 점을 썼다", "계수로 유효숫자(믿을 만한 자리)를 드러낸다는 점을 썼다"] }
  ]
};
