/* 형성평가 — 통합과학1 Ⅱ-2 04 물질의 전기적 성질(도체·반도체·절연체 · 띠 간격 · 도핑 · 다이오드 · 소재). 값은 단원 화면과 칠판 강의 화면(board-04.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅱ-2 물질의 규칙성과 성질", part: "04 물질의 전기적 성질",
  std: ["10통과1-02-06"], board: "board-04.html", sheet: "sheet-04.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "다음 물질을 전기적 성질에 따라 바르게 분류한 것은?",
      opts: ["은 — 반도체", "저마늄 — 반도체", "다이아몬드 — 도체", "규소 — 절연체"],
      a: 1, why: "저마늄과 규소는 도체와 절연체 사이의 반도체입니다. 은은 금속 가운데 전기가 가장 잘 통하는 도체이고, 다이아몬드는 띠 간격이 5.47 eV로 넓어 탄소로만 되어 있어도 절연체입니다." },
    { lv: "기본", type: "short", ref: 5,
      q: "물질 속에서 전자로 꽉 찬 원자가 띠와 비어 있는 전도띠 사이의 틈을 무엇이라고 할까요?",
      a: ["띠 간격", "띠간격", "에너지 띠 간격", "밴드갭", "밴드 갭"], why: "전자가 이 틈을 건너뛰어 전도띠로 올라가야 움직일 수 있습니다. 틈이 거의 없으면 도체, 어중간하면 반도체(규소 1.12 eV), 아주 넓으면 절연체(다이아몬드 5.47 eV)입니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "특정 온도 아래로 식히면 저항이 0이 되어 자기 공명 영상 장치(MRI)의 강한 전자석에 쓰이는 물질은?",
      opts: ["그래핀", "초전도체", "절연체", "p형 반도체"],
      a: 1, why: "초전도체는 임계 온도 아래에서 저항이 0이 되어 열이 나지 않으므로 아주 센 전류를 계속 흘릴 수 있습니다. 그래핀은 탄소 원자가 육각형으로 한 겹 깔린 물질로, 전기가 잘 통하는 차세대 소재입니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "구리선과 규소를 각각 20 ℃에서 200 ℃로 데웠습니다. 전기가 통하는 정도의 변화를 바르게 짝지은 것은?",
      opts: ["구리: 더 잘 통함 / 규소: 더 잘 통함", "구리: 덜 통함 / 규소: 덜 통함", "구리: 덜 통함 / 규소: 더 잘 통함", "구리: 더 잘 통함 / 규소: 덜 통함"],
      a: 2, why: "구리는 이미 움직이는 전자가 많고, 데우면 원자의 떨림이 커져 전자가 더 자주 부딪히므로 저항이 커집니다. 규소는 띠 간격을 건너뛰는 전자가 온도에 따라 지수 함수로 늘어 더 잘 통하게 됩니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "순수한 규소에 원소 X를 아주 조금 섞었더니 결합에 쓰이지 않고 남는 전자가 생겨 전기가 잘 통하게 되었습니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. X의 원자가 전자는 5개이다.<br>ㄴ. 이 반도체는 p형 반도체이다.<br>ㄷ. X로 인(P)을 쓸 수 있다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "규소는 원자가 전자 4개를 결합에 모두 씁니다. 전자가 하나 남으려면 X의 원자가 전자는 5개(인 등)입니다. 남는 전자가 전하를 나르므로 n형 반도체이며, p형은 원자가 전자가 3개인 붕소를 넣어 양공이 생긴 경우입니다." },
    { lv: "발전", type: "short", ref: 8, unit: "배",
      q: "단원 화면 모형에서 순수한 규소의 나르개는 1 cm³에 10¹⁰개이고, 전도도 배수 = (불순물 수 + 10¹⁰) ÷ 10¹⁰ 입니다. 1 cm³에 불순물 원자를 10¹⁴개 넣으면 전도도는 순수한 규소의 약 몇 배일까요? (10의 거듭제곱으로)",
      a: ["10000", "10^4", "10⁴", "1만", "만", "약10000", "약1만"], why: "(10¹⁴ + 10¹⁰) ÷ 10¹⁰ = 10⁴ + 1 ≈ 10⁴, 약 1만 배입니다. 불순물을 10¹⁶개 넣으면 약 100만 배가 됩니다. 아주 적은 양으로도 전도도를 크게 바꿀 수 있습니다." },
    { lv: "심화", type: "mc", ref: 9,
      q: "다이오드에 대한 설명으로 옳은 것은?",
      opts: ["n형 쪽에 (+)를 걸면 양공과 전자가 접합면에서 만나 전류가 잘 흐른다", "전압의 방향과 상관없이 전류가 같은 크기로 흐른다", "p형에 (+), n형에 (−)를 걸면 양공과 전자가 접합면에서 만나 전류가 흐른다", "역방향으로 걸면 접합면에 양공과 전자가 많이 모여 전류가 커진다"],
      a: 2, why: "p형에 (+)를 건 순방향에서는 양공과 전자가 접합면으로 몰려와 만나며 전류가 흐릅니다. 반대로 걸면(역방향) 양공과 전자가 양쪽 끝으로 끌려가 가운데가 비어 전류가 거의 흐르지 않습니다. 그래서 다이오드는 전류의 방향을 고르는 문 구실을 합니다." },
    { lv: "심화", type: "essay", ref: 8,
      q: "구리나 유리와 달리 반도체가 전자 기기의 핵심 재료가 된 까닭을 ‘띠 간격’과 ‘도핑’을 넣어 설명하세요.",
      model: "반도체는 띠 간격이 어중간해서 상온에서는 전자가 조금만 건너뛰지만, 온도나 빛, 불순물에 따라 전기가 통하는 정도가 크게 달라진다. 특히 인이나 붕소를 아주 조금 섞는 도핑으로 전도도를 수백만 배 바꾸고, 나르개를 전자(n형)나 양공(p형)으로 골라 만들 수 있다. 이 둘을 붙이면 다이오드·트랜지스터처럼 전류를 원하는 대로 조절하는 소자를 설계할 수 있다. 구리(늘 잘 통함)나 유리(거의 안 통함)는 이렇게 조절할 수 없다.",
      rubric: ["반도체의 띠 간격이 도체와 절연체 사이로 어중간하다고 썼다", "도핑으로 전도도를 크게 바꾸고 n형·p형을 골라 만들 수 있다고 썼다", "다이오드·트랜지스터처럼 전류를 조절하는 소자로 이어진다고 설명했다"] }
  ]
};
