window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-1 지구시스템", part: "01 지구시스템의 구성",
  std: ["10통과1-03-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "지구시스템의 구성 요소 가운데, 대기권 바깥의 우주 공간으로 지구시스템을 움직이는 에너지의 거의 전부가 들어오는 곳은?",
      opts: ["지권", "기권", "외권", "생물권"],
      a: 2, why: "대기권 바깥의 우주 공간이 외권입니다. 태양 복사 에너지가 외권에서 들어오고, 지구 자체도 태양계라는 더 큰 시스템의 구성 요소입니다." },
    { lv: "기본", type: "short", ref: 4,
      q: "바다뿐 아니라 빙하, 지하수, 하천, 호수처럼 물이 있는 곳을 모두 합친 권역을 무엇이라고 할까요?",
      a: ["수권"], why: "물이 있는 영역은 모두 수권입니다. 지구의 물은 대부분(약 96.5%)이 바닷물입니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "다음 가운데 수권이 지권을 바꾼 상호 작용은?",
      opts: ["밀려드는 파도가 바닷가 절벽 아래를 파내 동굴을 만든다",
             "화산에서 나온 기체가 대기의 성분을 바꾼다",
             "광합성을 하는 생물이 대기 중 산소를 늘린다",
             "바람에 날린 모래알이 바위를 깎아 낸다"],
      a: 0, why: "파도(수권)가 해안 절벽(지권)을 깎는 것이 수권 → 지권입니다. ②는 지권 → 기권, ③은 생물권 → 기권, ④는 기권 → 지권입니다." },
    { lv: "발전", type: "short", ref: 6, unit: "일",
      q: "대기 속 물은 저장량 12,900 km³, 해마다 드나드는 양 505,000 km³로 평균 약 9.3일 머뭅니다. 해마다 드나드는 양은 그대로이고 대기 속 물의 저장량만 2배가 된다면, 물이 대기에 머무는 시간은 약 며칠이 될까요? (소수 첫째 자리까지)",

    { lv: "발전", type: "mc", ref: 7,
      q: "바닷물은 평균 약 3,083년, 대기 속 물은 약 9.3일 머뭅니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 바닷물도 해마다 많은 양이 증발해 기권으로 간다.<br>ㄴ. 저장량이 큰 저장고는 드나드는 양과 관계없이 언제나 오래 머문다.<br>ㄷ. 물의 순환이 지금보다 빨라지면 바닷물이 머무는 시간은 짧아진다.",

      q: "단원 화면의 모형에서 가장 많이 식었을 때의 기온 변화는 성층권으로 올라간 이산화 황의 양에 비례하며, 20 Tg일 때 −0.5 ℃입니다. 이산화 황 10 Tg을 뿜은 화산이라면 가장 많이 식었을 때의 기온 변화는?",

        function frac(t) { return t <= 6 ? t / 6 : Math.exp(-(t - 6) / 12); }

        function X(t) { return X0 + t / 48 * (X1 - X0); }
        function Y(d) { return Y0 + (-d) / 0.6 * (Y1 - Y0); }

        [0, -0.2, -0.4, -0.6].forEach(function (d) { s += "<line x1='" + X0 + "' y1='" + Y(d) + "' x2='" + X1 + "' y2='" + Y(d) + "' stroke='#e3e8ef'/><text x='" + (X0 - 8) + "' y='" + (Y(d) + 4) + "' font-size='12' text-anchor='end'>" + (d === 0 ? "0" : "−" + Math.abs(d).toFixed(1)) + "</text>"; });

        [0, 12, 24, 36, 48].forEach(function (t) { s += "<text x='" + X(t) + "' y='" + (Y1 + 18) + "' font-size='12' text-anchor='middle'>" + t + "</text>"; });

      box: "ㄱ. 폭발 직후보다 몇 달 뒤에 기온이 더 많이 내려갔다.<br>ㄴ. 식히는 효과는 몇 해가 지나면 거의 사라진다.<br>ㄷ. 화산이 내뿜은 이산화 탄소 때문에 폭발 뒤 1년 동안 기온이 크게 올랐다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "황산 알갱이 장막이 퍼지는 동안 냉각이 커져 약 6개월 뒤 가장 많이 식고(ㄱ), 알갱이가 몇 해 안에 가라앉아 효과가 사라집니다(ㄴ). 화산의 이산화 탄소는 사람이 내놓는 양의 1% 안팎이라 짧게 보면 식히는 효과가 훨씬 큽니다(ㄷ 틀림)." },
    { lv: "심화", type: "essay", ref: 12,
      q: "어느 산의 숲이 큰 산불로 모두 사라졌습니다. 이 일이 지권·수권·기권에 각각 어떤 변화를 일으킬 수 있는지, 생물권과 다른 권역 사이의 상호 작용으로 설명하세요.",
      model: "지권: 뿌리가 흙을 붙잡지 못해 비가 오면 토양이 쉽게 깎여 나가고 산사태가 잦아진다. 수권: 빗물이 땅에 스며들지 못하고 빠르게 흘러 하천의 물이 갑자기 불어나고 흙탕물이 된다. 기권: 광합성으로 흡수하던 이산화 탄소가 줄고 나무가 탈 때 이산화 탄소가 나와 대기 중 농도가 높아진다. 이처럼 한 권역의 변화가 다른 권역에 이어진다.",
      rubric: ["지권의 변화(토양 침식·산사태 등)를 생물권과 연결해 썼다", "수권의 변화(빗물 흐름·하천·지하수 등)를 썼다", "기권의 변화(이산화 탄소 등 대기 성분)를 썼다"] }
  ]
