<title>형성평가 · 별에서 만들어지는 원소 (통합과학1 Ⅱ-1 02)</title>

<script>
/* 형성평가 — 통합과학1 Ⅱ-1 02 별에서 만들어지는 원소(핵융합 · 별의 질량 · 결합 에너지 · 초신성 · 중성자별 충돌). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅱ-1 자연의 구성 원소", part: "02 별에서 만들어지는 원소",
  std: ["10통과1-02-02"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "태양 중심에서 일어나 태양을 빛나게 하는 반응으로 옳은 것은?",
      opts: ["무거운 원자핵이 쪼개지는 핵분열", "가벼운 원자핵이 합쳐지는 핵융합", "수소가 산소와 결합하는 연소", "전자가 원자핵에 붙잡히는 재결합"],
      a: 1, why: "태양 중심(약 1,500만 K)에서는 수소 원자핵 넷이 여러 단계를 거쳐 헬륨 원자핵 하나가 되며 에너지가 나옵니다. 태양이 장작처럼 산소와 ‘타는’ 것이 아닙니다." },
    { lv: "기본", type: "short", ref: 7,
      q: "핵자 하나당 결합 에너지가 가장 커서, 결합 에너지 곡선의 꼭대기에 있는 원자핵은 무엇일까요?",
      a: ["철-56", "철56", "철", "Fe-56", "Fe", "56Fe"],
      why: "곡선의 꼭대기는 질량수 56인 철(약 8.79 MeV)입니다. 그래서 별 속의 핵융합은 철에서 멈춥니다." },
    { lv: "기본", type: "mc", ref: 11,
      q: "원소와 그 원소가 주로 만들어진 곳을 바르게 짝지은 것은?",
      opts: ["수소 — 별 속의 핵융합", "탄소 — 빅뱅 뒤 약 3분", "철 — 무거운 별 속의 핵융합", "금 — 태양 중심의 핵융합"],
      a: 2, why: "수소는 빅뱅, 탄소·질소·산소·규소·철은 별 속의 핵융합, 금·우라늄처럼 철보다 무거운 원소는 초신성 폭발과 중성자별 충돌에서 만들어졌습니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "질량이 태양의 3배인 별에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은? (단원 화면 모형 기준)",
      box: "ㄱ. 중심 온도가 1억 K를 넘어 헬륨을 태워 탄소·산소를 만든다.<br>ㄴ. 규소까지 태워 철을 만든 뒤 초신성으로 폭발한다.<br>ㄷ. 일생의 끝에 행성상 성운과 백색왜성을 남긴다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "태양 질량의 0.5~8배인 별은 헬륨을 태워 탄소·산소까지 만들고, 바깥층은 행성상 성운, 중심은 백색왜성이 됩니다. 철까지 가려면 약 10배가 넘어야 합니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "그림은 질량수에 따른 핵자 하나당 결합 에너지입니다. A, B, C에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: (function () {
        var BE = [[1, 0], [2, 1.112], [3, 2.827], [4, 7.074], [6, 5.332], [7, 5.606], [9, 6.463], [12, 7.680], [16, 7.976], [20, 8.032], [24, 8.261], [28, 8.448], [40, 8.551], [56, 8.790], [84, 8.717], [107, 8.554], [132, 8.428], [144, 8.288], [184, 8.065], [208, 7.867], [238, 7.570]];
        var X0 = 50, X1 = 400, Y0 = 20, Y1 = 180;
        function X(a) { return X0 + a / 240 * (X1 - X0); }
        function Y(b) { return Y1 - b / 10 * (Y1 - Y0); }
        var s = "<svg viewBox='0 0 430 220' width='430' height='220' aria-label='결합 에너지 곡선. A는 질량수 4 부근, B는 질량수 56의 꼭대기, C는 질량수 238 부근'>";
        s += "<line x1='" + X0 + "' y1='" + Y1 + "' x2='" + X1 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/><line x1='" + X0 + "' y1='" + Y0 + "' x2='" + X0 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/>";
        s += "<polyline points='" + BE.map(function (p) { return X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join(" ") + "' fill='none' stroke='#1462d8' stroke-width='2.5'/>";
        [[4, 7.074, "A"], [56, 8.79, "B"], [238, 7.57, "C"]].forEach(function (p) { s += "<circle cx='" + X(p[0]) + "' cy='" + Y(p[1]) + "' r='5' fill='#e03131'/><text x='" + (X(p[0]) + (p[2] === "C" ? -14 : 8)) + "' y='" + (Y(p[1]) + (p[2] === "A" ? 22 : -8)) + "' font-size='14' font-weight='800'>" + p[2] + "</text>"; });
        s += "<text x='" + X1 + "' y='" + (Y1 + 20) + "' font-size='12' text-anchor='end'>질량수 →</text><text x='4' y='14' font-size='12'>핵자 하나당 결합 에너지 ↑</text></svg>";
        return s;
      })(),
      box: "ㄱ. B는 가장 단단히 묶인 원자핵이다.<br>ㄴ. A 쪽의 가벼운 원자핵이 합쳐져 B 쪽으로 가면 에너지가 나온다.<br>ㄷ. C를 더 합쳐 무거운 원자핵을 만들면 에너지가 나온다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "꼭대기 B(철-56)가 가장 단단합니다. 더 단단한 쪽으로 갈 때 에너지가 나오므로 A 쪽은 합칠 때, C 쪽은 쪼갤 때 에너지가 나옵니다. C를 더 합치면 오히려 에너지를 넣어 주어야 합니다." },
    { lv: "발전", type: "short", ref: 12, unit: "kg",
      q: "사람 몸의 질량 가운데 9.5%인 수소만 빅뱅에서 만들어졌습니다. 몸무게 50 kg인 사람의 몸에서 빅뱅이 만든 원소의 질량은 몇 kg일까요? (소수 둘째 자리까지)",
      a: ["4.75", "약4.75"],
      why: "50 kg × 0.095 = 4.75 kg입니다. 나머지 50 − 4.75 = 45.25 kg(90.5%)은 별이 만든 원소입니다." },
    { lv: "심화", type: "mc", ref: 11,
      q: "태양과 지구에 대한 추론으로 가장 옳은 것은?",
      opts: ["태양은 일생의 끝에 초신성으로 폭발해 금을 만들 것이다", "지구 속의 철은 태양 중심에서 만들어져 지구로 왔다", "태양계를 만든 성운에는 태양보다 먼저 살다 간 별들이 만든 무거운 원소가 섞여 있었다", "별은 질량이 클수록 연료가 많아 더 오래 산다"],
      a: 2, why: "태양은 탄소·산소까지만 만들고 백색왜성으로 끝나며, 지금은 수소를 헬륨으로 바꾸는 중입니다. 지구의 철과 금은 태양이 태어나기 전에 다른 별의 속과 최후에서 만들어져 흩어졌다가 태양계 성운에 모인 것입니다. 무거운 별일수록 훨씬 빨리 탑니다(수명 ≈ 100억 년 × M<sup>−2.5</sup>)." },
    { lv: "심화", type: "essay", ref: 8,
      q: "태양 질량의 20배인 별이 일생 동안 원소를 만들고 우주로 퍼뜨리는 과정을 ‘중심 온도’와 ‘결합 에너지’라는 말을 넣어 차례대로 설명하세요.",
      model: "질량이 커서 중력이 세게 짓누르므로 중심 온도가 매우 높다. 수소를 헬륨으로, 헬륨을 탄소·산소로, 이어 네온·마그네슘, 규소·황을 거쳐 마침내 철을 만들며 양파처럼 층을 이룬다. 철은 핵자 하나당 결합 에너지가 가장 커서 더 합치면 에너지가 나오지 않고 오히려 들어가므로, 중심핵이 버티지 못하고 무너지며 초신성으로 폭발한다. 이때 별이 만든 원소가 우주로 퍼지고, 쏟아지는 중성자로 철보다 무거운 원소도 만들어진다.",
      rubric: ["질량이 클수록 중심 온도가 높아 더 무거운 원소까지 핵융합한다고 썼다", "철이 결합 에너지 곡선의 꼭대기라 핵융합이 멈춘다고 썼다", "초신성 폭발로 원소가 우주로 퍼진다(철보다 무거운 원소도 생긴다)고 썼다"] }
  ]
};
</script>
