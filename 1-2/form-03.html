<title>형성평가 · 측정과 현대 문명 (통합과학1 Ⅰ-2 03)</title>

</head>
<body>
<script>
/* 형성평가 — 통합과학1 Ⅰ-2 03 측정과 현대 문명(원자시계와 GPS · 나노미터 공정 · 표본화와 양자화 · 디지털 정보). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅰ-2 과학의 측정과 우리 사회", part: "03 측정과 현대 문명",
  std: ["10통과1-01-04"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "GPS 수신기가 위성까지의 거리를 구하는 방법으로 옳은 것은?",
      opts: ["위성이 보내 준 사진에서 건물 크기를 잰다",
             "전파가 위성에서 오는 데 걸린 시간에 빛의 속력을 곱한다",
             "전파의 세기가 약할수록 멀다고만 판단한다",
             "위성의 무게와 높이로 계산한다"],
      a: 1, why: "거리 = 빛의 속력 × 걸린 시간입니다. 그래서 위성은 원자시계를 싣고 시간을 아주 정밀하게 잽니다. 시간이 틀리면 거리가, 거리가 틀리면 위치가 틀립니다." },
    { lv: "기본", type: "short", ref: 10,
      q: "손목의 맥박처럼 끊김 없이 이어지는 신호를 일정한 시간 간격으로 재어 값을 얻는 과정을 무엇이라고 할까요?",
      a: ["표본화", "샘플링"], why: "얼마나 자주 재는지를 정하는 단계가 표본화입니다. 드문드문 재면 원래 물결을 되살릴 수 없습니다(단원 화면: 1초에 4번이면 최대 오차 41.2 %, 12번이면 4.9 %)." },
    { lv: "기본", type: "mc", ref: 6,
      q: "정밀 측정이 쓰이는 분야와 그 분야가 다루는 자릿수를 바르게 짝지은 것은?",
      opts: ["반도체 공정 — 약 10⁻⁹ m (나노미터)", "위성 항법(GPS) — 약 10⁻³ 초", "기후 관측 — 약 10⁻⁹ ℃", "의료 영상 진단 — 약 10³ m"],
      a: 0, why: "반도체는 회로 선폭을 나노미터(10⁻⁹ m) 단위로 다룹니다. GPS는 약 10⁻⁹ 초, 기후 관측은 약 10⁻¹ ℃, 의료 영상은 약 10⁻³ m(mm) 단위입니다." },
    { lv: "발전", type: "short", ref: 5, unit: "m",
      q: "단원 화면 모형(거리 = 빛의 속력 × 시간)에서 GPS 위성의 시계가 50 ns(10억분의 50초) 틀리면 위치 오차는 약 몇 m일까요? (빛의 속력은 3 × 10⁸ m/s로 계산)",
      a: ["15", "약15", "15m"], why: "3 × 10⁸ m/s × 50 × 10⁻⁹ s = 15 m입니다. 1 ns에 약 30 cm이므로 50 ns면 약 15 m로, 10 m를 지키려면 시계가 30 ns 안쪽까지 맞아야 합니다." },
    { lv: "발전", type: "mc", ref: 11,
      q: "30~45 ℃를 재는 체온계가 이 범위를 6비트로 나눈다면, 한 칸의 크기는 약 얼마일까요?",
      opts: ["약 2.5 ℃", "약 0.94 ℃", "약 0.23 ℃", "약 0.06 ℃"],
      a: 2, why: "6비트는 2⁶ = 64칸입니다. 15 ℃ ÷ 64 ≈ 0.23 ℃입니다. 0.94 ℃는 4비트(16칸), 0.06 ℃는 8비트(256칸)의 한 칸입니다. 2.5 ℃는 비트 수를 칸 수로 착각해 15 ÷ 6으로 나눈 값입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "반도체 공장에서 선폭이 목표의 ±10 %를 벗어나면 버리고, 측정·공정의 오차는 0.8 nm입니다(단원 화면 모형). 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 목표가 90 nm이면 허용 범위는 ± 9 nm이다.<br>ㄴ. 오차가 같아도 목표를 10 nm로 줄이면 쓸 수 있는 칩의 비율(수율)이 낮아진다.<br>ㄷ. 목표를 10 nm로 줄일 때 수율을 지키려면 오차를 0.8 nm보다 크게 해도 된다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "허용 범위는 목표의 10 %라 90 nm면 ± 9 nm, 10 nm면 ± 1 nm로 좁아집니다. 같은 오차 0.8 nm에서 수율은 약 100 %에서 약 79 %로 떨어지므로, 수율을 지키려면 오차를 오히려 줄여야(0.5 nm면 95.4 %) 합니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "측정값을 디지털로 바꾸는 일에 대한 설명으로 옳은 것은?",
      opts: ["디지털로 바꾸면 측정값이 원래 값보다 더 정확해진다",
             "양자화하면 반올림 오차가 생기지만, 숫자가 된 값은 복사하고 멀리 보내도 변하지 않는다",
             "디지털로 바꾸면 측정 기기의 계통 오차가 저절로 사라진다",
             "표본화를 드물게 할수록 원래 신호에 더 가까워진다"],
      a: 1, why: "디지털 변환은 없던 정확도를 만들지 못하고 오히려 양자화 오차(한 칸의 절반까지)를 더합니다. 계통 오차는 교정해야 사라지고, 표본화는 자주 할수록 원래 신호에 가까워집니다. 대신 숫자가 된 값은 옮겨도 흐려지지 않아 정보 통신으로 나누고 오래 쌓아 견줄 수 있습니다." },
    { lv: "심화", type: "essay", ref: 12,
      q: "전국의 기상 관측소가 기온을 1시간마다 0.1 ℃ 단위로 재어 디지털로 기록해 보낸다고 합시다. 이 상황에서 표본화와 양자화가 각각 무엇인지 설명하고, 기록 간격이나 칸 크기를 너무 크게 하면 생길 문제를 하나씩 드세요. 또 이렇게 디지털로 기록할 때의 좋은 점을 쓰세요.",
      model: "표본화는 이어지는 기온 변화를 1시간마다 재는 것이고, 양자화는 잰 값을 0.1 ℃ 칸으로 나누어 숫자로 나타내는 것이다. 기록 간격을 예를 들어 하루 한 번으로 늘리면 그 사이에 기온이 내려갔다 오르는 변화를 놓친다. 칸을 1 ℃로 크게 하면 15.2 ℃와 15.6 ℃를 구분하지 못한다. 디지털로 기록하면 몇 번을 복사하고 정보 통신으로 멀리 보내도 값이 변하지 않으므로, 전국의 자료를 같은 형식으로 모아 수십 년치를 비교할 수 있다.",
      rubric: ["표본화(얼마나 자주)와 양자화(얼마나 잘게)를 상황에 맞게 설명했다", "간격이 크면 변화를 놓치고, 칸이 크면 작은 차이를 구분하지 못한다는 문제를 들었다", "복사·전송해도 값이 변하지 않아 모으고 비교할 수 있다는 디지털의 장점을 썼다"] }
  ]
};
</script>
<script src="../assets/formative.js"></script>
