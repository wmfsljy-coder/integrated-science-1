<script>
/* 형성평가 — 통합과학1 Ⅱ-2 03 지각과 생명체의 물질(규산염 사면체 · 연결 방식 · 탄소 화합물 · 단위체와 다양성). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅱ-2 물질의 규칙성과 성질", part: "03 지각과 생명체의 물질",
  std: ["10통과1-02-05"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "short", ref: 4,
      q: "감람석·휘석·운모·석영처럼 지각을 이루는 광물의 기본 부품으로, 규소 원자 하나를 산소 원자 네 개가 둘러싼 것을 무엇이라고 할까요?",
      a: ["규산염 사면체", "규산염사면체", "SiO4 사면체", "사면체"], why: "규산염 사면체(SiO₄)는 지각의 질량비 1·2위인 산소(46.6%)와 규소(27.7%)로 이루어진 부품입니다. 이 부품이 이어지는 방식에 따라 여러 규산염 광물이 됩니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "단위체와 그것이 이어져 만들어진 물질을 바르게 짝지은 것은?",
      opts: ["아미노산 — 핵산", "뉴클레오타이드 — 단백질", "아미노산 — 단백질", "규산염 사면체 — DNA"],
      a: 2, why: "아미노산(20종)이 이어지면 단백질, 뉴클레오타이드(염기 4종)가 이어지면 핵산(DNA·RNA), 규산염 사면체가 이어지면 규산염 광물이 됩니다." },
    { lv: "기본", type: "mc", ref: 7,
      q: "운모가 손톱으로도 한 장씩 얇게 벗겨지는 까닭은?",
      opts: ["사면체끼리 전혀 연결되지 않아서", "사면체가 판을 이루고, 판과 판 사이의 결합이 약해서", "산소를 네 개 모두 나눠 써서 모든 방향으로 단단해서", "규소 대신 탄소로 만들어져서"],
      a: 1, why: "운모는 사면체가 산소 세 개를 나눠 써서 넓은 판(판상 구조)을 이룹니다. 판 안쪽은 튼튼하지만 판과 판 사이가 약해 그 틈을 따라 벗겨집니다. 산소를 모두 나눠 쓴 망상 구조(석영)는 약한 면이 없습니다." },
    { lv: "발전", type: "short", ref: 5, unit: "",
      q: "어떤 규산염 구조에서 사면체마다 이웃과 산소를 3개씩 나눠 씁니다. 이 구조의 규소 : 산소 개수비를 ‘1 : □’ 꼴로 쓸 때 □에 들어갈 수는?",
      a: ["2.5", "5/2", "2.5개"], why: "나눠 쓴 산소는 두 사면체가 반씩 가지므로 규소 하나당 산소는 4 − 3 × ½ = 2.5개입니다. 규소 : 산소 = 1 : 2.5인 판상 구조로, 운모가 그렇습니다." },
    { lv: "발전", type: "mc", ref: 5,
      q: "규산염 광물에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 이웃과 나눠 쓰는 산소 수가 많을수록 규소 하나당 산소 수가 적어진다.<br>ㄴ. 감람석과 석영은 서로 다른 모양의 사면체로 이루어져 있다.<br>ㄷ. 석영(망상 구조)의 규소 : 산소 비는 1 : 2이다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "ㄱ: 나눠 쓴 산소는 반씩만 세므로 많이 나눠 쓸수록 산소 비율이 줄어듭니다(1 : 4 → 1 : 2). ㄴ: 모든 규산염 광물은 같은 SiO₄ 사면체로 이루어지고, 다른 것은 연결 방식입니다. ㄷ: 네 개를 모두 나눠 쓰면 4 − 2 = 2입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "사슬형 탄화수소(CₙH₂ₙ₊₂)에 대한 설명으로 옳은 것은? (1기압, 실온 25 ℃)",
      opts: ["탄소 수가 많을수록 끓는점이 낮아진다", "탄소 4개인 뷰테인(끓는점 −0.5 ℃)은 실온에서 액체이다", "탄소 6개인 사슬형 탄화수소의 분자식은 C₆H₁₄이다", "탄소 수가 같으면 고리형이 사슬형보다 수소가 2개 많다"],
      a: 2, why: "CₙH₂ₙ₊₂에 n = 6을 넣으면 C₆H₁₄(헥세인)입니다. 탄소 수가 많을수록 끓는점이 높아지고, 뷰테인은 끓는점이 −0.5 ℃라 실온에서 기체입니다. 고리형(CₙH₂ₙ)은 사슬형보다 수소가 2개 적습니다." },
    { lv: "심화", type: "short", ref: 10, unit: "개",
      q: "아미노산 20종으로 서열을 만들 때, 가능한 서열이 100만 가지(10⁶)를 처음으로 넘으려면 아미노산을 적어도 몇 개 이어 붙여야 할까요? (20⁴ = 160,000)",
      a: ["5", "다섯"], why: "20⁴ = 160,000으로 100만에 못 미치고, 20⁵ = 3,200,000으로 처음 100만을 넘습니다. 자리마다 20가지씩 곱해지므로 몇 개만 이어도 가짓수가 폭발적으로 늘어납니다." },
    { lv: "심화", type: "essay", ref: 11,
      q: "지각의 규산염 광물과 생명체의 단백질은 서로 아주 달라 보이지만 ‘같은 설계도’를 쓴다고 합니다. 두 물질에서 단위체와, 다양성을 만드는 요인을 각각 들어 공통점을 설명하세요.",
      model: "규산염 광물의 단위체는 규산염 사면체이고, 사면체가 이웃과 산소를 몇 개 나눠 쓰는지(연결 방식)에 따라 감람석·휘석·운모·석영처럼 성질이 다른 광물이 된다. 단백질의 단위체는 아미노산 20종이고, 아미노산을 잇는 순서와 개수에 따라 수많은 단백질이 만들어진다. 둘 다 적은 종류의 단위체를 여러 방식으로 이어 다양한 물질을 만든다는 공통점이 있다.",
      rubric: ["규산염 광물의 단위체(규산염 사면체)와 연결 방식(나눠 쓰는 산소 수)을 썼다", "단백질의 단위체(아미노산)와 순서·개수를 썼다", "적은 종류의 단위체를 잇는 방식으로 다양성이 생긴다는 공통점을 정리했다"] }
  ]
};
