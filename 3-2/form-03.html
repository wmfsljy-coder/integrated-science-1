<title>형성평가 · 충돌과 운동량 보존 (통합과학1 Ⅲ-2 03)</title>

</head>
<body>
<script>
/* 형성평가 — 통합과학1 Ⅲ-2 03 충돌과 운동량 보존(운동량 · 운동량 보존 · 충격량 · 안전장치). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-2 역학 시스템", part: "03 충돌과 운동량 보존",
  std: ["10통과1-03-04"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "short", ref: 4, unit: "kg·m/s",
      q: "질량 0.5 kg인 공이 4 m/s로 굴러가고 있습니다. 이 공의 운동량의 크기는 얼마일까요?",
      a: ["2", "2.0", "약2"], why: "운동량 = 질량 × 속도 = 0.5 × 4 = 2 kg·m/s입니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "질량 8,000 kg인 트럭과 1,400 kg인 승용차가 정면으로 충돌했습니다. 충돌하는 동안에 대한 설명으로 옳은 것은?",
      opts: ["가벼운 승용차가 더 큰 충격량을 받는다", "무거운 트럭이 더 큰 충격량을 받는다", "두 차가 받는 충격량의 크기는 같고, 속도 변화는 승용차가 더 크다", "두 차의 속도 변화는 크기가 같다"],
      a: 2, why: "서로 미는 힘은 작용 반작용이라 크기가 같고 부딪혀 있는 시간도 같으므로 충격량의 크기가 같습니다. 속도 변화는 충격량 ÷ 질량이므로 질량이 작은 승용차가 약 5.7배 큽니다." },
    { lv: "기본", type: "mc", ref: 13,
      q: "멈추는 데 걸리는 시간을 늘려 물체가 받는 힘을 줄이는 예가 <b>아닌</b> 것은?",
      opts: ["체조 선수가 두꺼운 매트 위에 착지한다", "번지점프 줄이 쭉 늘어나며 사람을 멈춘다", "단단한 망치로 못을 내리친다", "포수가 글러브를 뒤로 빼며 공을 받는다"],
      a: 2, why: "망치는 아주 짧은 시간에 멈추게 해 큰 힘을 내는 도구입니다. 같은 충격량이라도 시간을 줄이면 힘이 커집니다(F = Δp ÷ Δt). 나머지는 모두 시간을 늘려 힘을 줄입니다." },
    { lv: "발전", type: "short", ref: 6, unit: "m/s",
      q: "마찰이 없는 레일 위에서 질량 3 kg인 수레가 4 m/s로 굴러와, 정지해 있던 1 kg 수레와 부딪혀 한 덩어리가 되었습니다. 충돌 후 속력은?",
      a: ["3", "3.0", "약3"], why: "충돌 전 운동량은 3 × 4 = 12 kg·m/s이고, 운동량이 보존되므로 (3 + 1) × v = 12, v = 3 m/s입니다. 이때 운동 에너지는 24 J에서 18 J로 줄어듭니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "그림은 같은 야구공(0.145 kg, 40 m/s)을 두 방법 A, B로 받아 멈출 때 손이 받은 힘을 시간에 따라 단순하게 나타낸 것입니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: (function () {
        var s = "<svg viewBox='0 0 420 220' width='420' height='220' aria-label='힘-시간 그래프: A는 0.01초 동안 580 N, B는 0.02초 동안 290 N'>";
        s += "<line x1='60' y1='180' x2='400' y2='180' stroke='#161b28' stroke-width='2'/><line x1='60' y1='20' x2='60' y2='180' stroke='#161b28' stroke-width='2'/>";
        s += "<rect x='60' y='36' width='140' height='144' fill='rgba(224,49,49,.15)' stroke='#e03131' stroke-width='2'/>";
        s += "<rect x='60' y='108' width='280' height='72' fill='rgba(47,158,68,.15)' stroke='#2f9e44' stroke-width='2'/>";
        s += "<g font-size='13' font-weight='800'><text x='130' y='70' text-anchor='middle' fill='#c92a2a'>A</text><text x='270' y='150' text-anchor='middle' fill='#2b8a3e'>B</text>";
        s += "<text x='54' y='41' text-anchor='end'>580</text><text x='54' y='113' text-anchor='end'>290</text><text x='200' y='198' text-anchor='middle'>0.01</text><text x='340' y='198' text-anchor='middle'>0.02</text></g>";
        s += "<text x='400' y='214' font-size='12' text-anchor='end'>시간 (초)</text><text x='8' y='14' font-size='12'>힘 (N)</text></svg>";
        return s;
      })(),
      box: "ㄱ. A와 B에서 공이 받은 충격량은 같다.<br>ㄴ. B는 A보다 공을 멈추는 데 걸린 시간이 길다.<br>ㄷ. 손이 받은 충격량은 A가 B의 2배이다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "두 직사각형의 넓이는 0.01 × 580 = 0.02 × 290 = 5.8 N·s로 같고, 이는 공의 운동량 변화 0.145 × 40과 같습니다(ㄱ 맞음, ㄷ 틀림). B는 시간을 2배로 늘려 평균 힘을 절반으로 줄였습니다(ㄴ 맞음)." },
    { lv: "발전", type: "short", ref: 11, unit: "N",
      q: "질량 1,400 kg인 자동차가 14 m/s로 달리다 벽에 부딪혀 0.10초 만에 멈췄습니다. 자동차가 받은 평균 힘의 크기는 몇 N일까요?",
      a: ["196000", "196,000", "19.6만", "약196000"], why: "충격량 = 운동량의 변화 = 1,400 × 14 = 19,600 N·s입니다. 평균 힘 = 19,600 ÷ 0.10 = 196,000 N입니다. 멈추는 시간이 길수록 이 값이 작아집니다." },
    { lv: "심화", type: "mc", ref: 5,
      q: "마찰이 없는 레일 위에서 질량이 같은 수레 A가 3 m/s로 굴러와 정지해 있던 수레 B와 완전 탄성 충돌했습니다. 충돌 직후의 모습으로 옳은 것은?",
      opts: ["A와 B가 붙어 1.5 m/s로 함께 움직인다", "A는 멈추고 B가 3 m/s로 움직인다", "A는 3 m/s로 뒤로 튕기고 B는 정지해 있다", "A와 B가 모두 3 m/s로 움직인다"],
      a: 1, why: "완전 탄성 충돌은 운동량과 운동 에너지가 모두 보존됩니다. 질량이 같으면 A가 멈추고 B가 3 m/s로 움직여야 두 조건을 모두 만족합니다. ①은 운동량은 보존되지만 운동 에너지가 줄어드는 완전 비탄성 충돌, ③④는 운동량 보존을 어깁니다." },
    { lv: "심화", type: "essay", ref: 12,
      q: "‘에어백과 안전띠는 탑승자가 받는 충격량을 줄여 준다’는 말에서 잘못된 점을 찾아 고치고, 두 장치가 탑승자를 보호하는 원리를 충격량·시간·평균 힘을 써서 설명하세요.",
      model: "탑승자가 멈출 때의 운동량 변화는 정해져 있으므로 충격량은 줄어들지 않는다. 안전띠는 조금 늘어나며 몸을 붙잡고, 에어백은 부풀어 몸이 닿는 넓이를 넓히며 몸이 멈추는 데 걸리는 시간을 늘린다. 충격량 = 평균 힘 × 시간이므로, 같은 충격량에서 시간이 길어지면 몸이 받는 평균 힘이 작아져 다치는 정도가 줄어든다.",
      rubric: ["충격량(운동량 변화)은 줄어들지 않는다고 바르게 고쳤다", "안전띠·에어백이 멈추는 시간을 늘린다고 설명했다", "시간이 길어지면 평균 힘이 줄어든다는 관계(F = Δp ÷ Δt)를 썼다"] }
  ]
};
</script>
