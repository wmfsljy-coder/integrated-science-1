window.FORMATIVE = {

    { lv: "기본", type: "mc", ref: 4,

      opts: ["대서양 양쪽 대륙의 해안선이 퍼즐처럼 맞물린다",

    { lv: "기본", type: "short", ref: 6,

    { lv: "기본", type: "mc", ref: 7,
      q: "두 판이 서로 멀어지면서 그 틈으로 맨틀 물질이 올라와 새로운 해양 지각이 만들어지는 경계는?",

    { lv: "발전", type: "mc", ref: 8,
      q: "미국 캘리포니아의 산안드레아스 단층에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",

        "<text x='5' y='196' font-size='11' fill='#5f6b80'>※ 크기와 높이는 실제 비율이 아님</text></svg>",
      box: "ㄱ. 열점에서 멀리 떨어진 섬일수록 나이가 많다.<br>ㄴ. 판은 열점에서 섬 B, C가 있는 쪽으로 움직이고 있다.<br>ㄷ. 두 자료로 구한 판의 속력은 1 cm/년보다 작다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "열점은 제자리에 있고 판이 섬을 싣고 가므로, 멀수록 오래된 섬이고(ㄱ) 판은 오래된 섬 쪽으로 움직입니다(ㄴ). 500 km ÷ 500만 년 = 10 cm/년, 2,400 km ÷ 2,800만 년 ≈ 8.6 cm/년이므로 1 cm/년보다 훨씬 빠릅니다(ㄷ 틀림)." },

      model: "대륙 이동설에는 대륙을 움직이는 힘(원동력)에 대한 설명이 빠져 있었다. 홈스는 지구 내부 에너지로 일어나는 맨틀 대류를 원동력으로 제안했고, 1950~60년대 음향 측심으로 해령과 해구 같은 해저 지형이 밝혀졌다. 헤스 등은 해령에서 새 해양 지각이 생겨 양쪽으로 밀려난다는 해저 확장설을 내놓았고, 해령을 축으로 대칭인 고지자기 줄무늬가 이를 뒷받침했다. 그 결과 지구의 겉껍질이 여러 판으로 나뉘어 맨틀 대류를 타고 움직인다는 판구조론이 자리를 잡았다.",
      rubric: ["대륙을 움직이는 힘(원동력)을 설명하지 못했다고 썼다", "맨틀 대류를 원동력으로 들었다", "해저 확장설과 그 증거(해령·고지자기 줄무늬 대칭 등)를 들었다"] }
  ]
