<script>
/* 형성평가 — 통합과학1 Ⅰ-2 01 정밀도와 정확도(정확도·정밀도 · 계통 오차·우연 오차 · 유효숫자와 어림). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅰ-2 과학의 측정과 우리 사회", part: "01 정밀도와 정확도",
  std: ["10통과1-01-03"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "같은 양을 여러 번 잰 측정값의 평균이 참값에 얼마나 가까운지를 나타내는 말은?",
      opts: ["정밀도", "정확도", "유효숫자", "표준편차"],
      a: 1, why: "평균이 참값에 가까운 정도가 정확도입니다. 측정값끼리 모여 있는 정도는 정밀도이고, 그 흩어짐을 수로 나타낸 것이 표준편차입니다." },
    { lv: "기본", type: "short", ref: 7,
      q: "체중계에 아무것도 올리지 않았는데 0.3 kg을 가리킵니다. 이 체중계로 잰 값에는 모두 같은 쪽으로 0.3 kg씩 치우친 오차가 생깁니다. 이런 오차를 무엇이라고 할까요?",
      a: ["계통 오차", "계통오차"], why: "영점이 어긋나 매번 같은 쪽으로 같은 만큼 치우치는 오차는 계통 오차입니다. 영점을 다시 맞추는 교정을 해야 사라집니다." },
    { lv: "기본", type: "mc", ref: 5,
      q: "그림은 네 사람이 같은 과녁에 10발씩 쏜 결과입니다(가운데 붉은 점이 참값). ‘정밀하지만 정확하지 않은’ 표적지는?",
      fig: (function () {
        var raw = [[0.62, -0.31], [-0.44, 0.78], [1.12, 0.36], [-0.85, -0.52], [0.21, 1.04], [-1.06, 0.18], [0.48, -0.92], [-0.29, -1.11], [0.93, 0.71], [-0.72, -0.21]];
        var mx = 0, my = 0, s = 0, i, U = [];
        for (i = 0; i < 10; i++) { mx += raw[i][0] / 10; my += raw[i][1] / 10; }
        for (i = 0; i < 10; i++) s += Math.pow(raw[i][0] - mx, 2) + Math.pow(raw[i][1] - my, 2);
        s = Math.sqrt(s / 10);
        for (i = 0; i < 10; i++) U.push([(raw[i][0] - mx) / s, (raw[i][1] - my) / s]);
        var P = [["A", 0, 0, 0.36], ["B", -0.4, 0.36, 0.09], ["C", 0, 0, 0.09], ["D", -0.4, 0.36, 0.36]];
        var out = "<svg viewBox='0 0 520 150' width='520' height='150' aria-label='표적지 A~D. A는 넓게 흩어졌지만 가운데를 둘러쌌고, B는 왼쪽 아래 한곳에 모였고, C는 한가운데에 모였고, D는 왼쪽 아래로 치우친 채 흩어졌다'>";
        P.forEach(function (p, k) {
          var cx = 65 + k * 130, cy = 62, r = 55, j;
          for (j = 0; j < 4; j++) out += "<circle cx='" + cx + "' cy='" + cy + "' r='" + (r * (1 - j * 0.25)) + "' fill='" + (j % 2 ? "#eef1f5" : "#fff") + "' stroke='#495057' stroke-width='1.5'/>";
          out += "<circle cx='" + cx + "' cy='" + cy + "' r='4' fill='#e03131'/>";
          for (j = 0; j < 10; j++) out += "<circle cx='" + (cx + p[1] * r + U[j][0] * p[3] * r).toFixed(1) + "' cy='" + (cy + p[2] * r + U[j][1] * p[3] * r).toFixed(1) + "' r='3' fill='#161b28'/>";
          out += "<text x='" + cx + "' y='142' font-size='16' font-weight='800' text-anchor='middle'>" + p[0] + "</text>";
        });
        return out + "</svg>";
      })(),
      opts: ["A", "B", "C", "D"],
      a: 1, why: "B는 한곳에 촘촘히 모였으니 정밀하지만, 모인 자리가 참값에서 벗어났으니 정확하지 않습니다. A는 정확하지만 정밀하지 않고, C는 정확하고 정밀하며, D는 둘 다 아닙니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "영점이 맞은 저울 A와 영점이 +0.5 g 틀어진 저울 B로 50.00 g 분동을 각각 60번씩 재어 평균을 구했습니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. A의 평균은 잰 횟수가 늘수록 50.00 g에 다가간다.<br>ㄴ. B도 잰 횟수를 충분히 늘리면 평균이 50.00 g에 다가간다.<br>ㄷ. B로 참값에 가까운 값을 얻으려면 재기 전에 영점을 다시 맞춰야 한다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "반복해서 평균을 내면 우연 오차가 줄어 A의 평균은 참값에 다가갑니다(단원 화면: 25번 평균 49.995 g). B의 영점 오차는 계통 오차라 60번을 재도 평균이 50.482 g으로 약 0.5 g 어긋난 채 남습니다. 그래서 ㄴ은 틀리고, 교정(ㄷ)이 필요합니다." },
    { lv: "발전", type: "short", ref: 12, unit: "자리",
      q: "최소 눈금이 1 mm인 자로 잰 공책 두께를 2.35 cm로 적었습니다. 이 측정값의 유효숫자는 몇 자리일까요?",
      a: ["3", "3자리", "세자리"], why: "1 mm(0.1 cm) 자리까지 눈금으로 읽은 2, 3에 0.01 cm 자리를 어림한 5를 더해 유효숫자는 3자리입니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "다음 중 ‘계통 오차’에 해당하는 것은?",
      opts: ["실험실 온도가 오르내려 측정값이 조금씩 흔들린다",
             "눈금을 읽을 때 매번 같은 쪽에서 비스듬히 내려다본다",
             "같은 물체를 여러 번 재니 값이 조금씩 다르게 나온다",
             "초시계를 누르는 순간이 매번 조금씩 다르다"],
      a: 1, why: "매번 같은 쪽에서 비스듬히 보면 값이 언제나 같은 방향으로 치우치므로 계통 오차입니다. 나머지는 위로도 아래로도 흔들리는 우연 오차라 여러 번 재어 평균을 내면 줄어듭니다." },
    { lv: "심화", type: "mc", ref: 9,
      q: "“같은 것을 많이 재서 평균을 내면 언제나 참값에 가까워진다.” 이 주장에 대한 평가로 가장 알맞은 것은?",
      opts: ["옳다. 반복해서 평균을 내면 모든 종류의 오차가 줄어든다",
             "틀렸다. 반복은 우연 오차만 줄이므로 영점이 어긋난 기기로는 아무리 재도 평균이 참값에 닿지 않는다",
             "옳다. 많이 잴수록 측정값의 표준편차가 0에 가까워지기 때문이다",
             "틀렸다. 반복하면 계통 오차만 줄고 우연 오차는 그대로 남는다"],
      a: 1, why: "위아래로 흩어지는 우연 오차는 평균을 내면 상쇄되지만, 한쪽으로 치우친 계통 오차는 모든 값에 똑같이 들어 있어 평균에도 그대로 남습니다. 단원 화면에서도 흩어짐(표준편차)은 횟수를 늘려도 약 0.15 g으로 거의 그대로이고 평균만 참값에 다가갔습니다." },
    { lv: "심화", type: "essay", ref: 7,
      q: "한 모둠이 같은 연필을 같은 자로 다섯 번 재었더니, 다섯 값이 서로 거의 같으면서 모두 실제보다 약 2 mm 길게 나왔습니다. 이 측정을 정확도와 정밀도로 평가하고, 오차의 종류와 그 원인을 추리한 뒤, 참값에 가까운 값을 얻는 방법을 제안하세요.",
      model: "다섯 값이 서로 거의 같으므로 정밀도는 높지만, 모두 실제보다 2 mm 길게 나왔으므로 정확도는 낮다. 모든 값이 같은 쪽으로 같은 만큼 치우쳤으므로 계통 오차이다. 자 끝이 닳아 0 눈금이 연필 끝과 맞지 않았거나, 늘 같은 쪽에서 비스듬히 읽는 버릇이 원인일 수 있다. 계통 오차는 여러 번 재어 평균을 내도 줄지 않으므로, 영점을 확인해 교정하거나(예: 1 cm 눈금에 맞춰 재고 1 cm를 뺀다) 정면에서 읽도록 방법을 바꿔야 한다.",
      rubric: ["정밀도는 높고 정확도는 낮다고 평가했다", "모든 값이 같은 쪽으로 치우쳤다는 근거로 계통 오차라고 판단하고 원인을 하나 이상 들었다", "반복·평균으로는 줄지 않음을 밝히고 교정 등 알맞은 방법을 제안했다"] }
  ]
};
</script>
