<script>
/* 형성평가 — 통합과학1 Ⅲ-2 01 중력과 자유 낙하(공기 저항 · 자유 낙하 · 중력 가속도 · 수평으로 던진 물체 · 인공위성). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-2 역학 시스템", part: "01 중력과 자유 낙하",
  std: ["10통과1-03-03"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 5,
      q: "공기를 모두 빼낸 높이 5 m의 통에서 쇠공(약 0.5 kg)과 깃털(약 1 g)을 같은 높이에서 동시에 놓았습니다. 일어나는 일로 옳은 것은?",
      opts: ["쇠공이 더 무거우므로 먼저 바닥에 닿는다", "깃털은 가벼우므로 공기가 없어도 천천히 내려온다", "두 물체가 매 순간 같은 높이에 있다가 동시에 닿는다", "공기가 없으면 중력도 사라져 두 물체가 떠 있다"],
      a: 2, why: "공기 저항이 없으면 두 물체는 중력만 받아 똑같이 자유 낙하합니다. 낙하를 정하는 것은 질량이 아니라 중력 가속도 g입니다. 진공이라고 중력이 사라지지는 않습니다." },
    { lv: "기본", type: "short", ref: 6,
      q: "공기 저항 없이 떨어지는 물체는 1초마다 속도가 똑같은 양만큼 늘어납니다. 이 ‘1초마다 빨라지는 정도’를 무엇이라고 할까요?",
      a: ["중력 가속도", "중력가속도", "g"], why: "중력 가속도 g입니다. 지구에서는 약 9.8 m/s²로, 떨어지는 물체의 속도가 1초마다 약 9.8 m/s씩 커집니다." },
    { lv: "기본", type: "mc", ref: 8,
      q: "옥상에서 수평으로 던진 공의 운동을 두 방향으로 나누어 볼 때, 바르게 짝지은 것은? (공기 저항 무시)",
      opts: ["수평 방향: 등속 운동 · 연직 방향: 자유 낙하", "수평 방향: 점점 빨라짐 · 연직 방향: 등속 운동", "수평 방향: 점점 느려짐 · 연직 방향: 자유 낙하", "수평 방향: 등속 운동 · 연직 방향: 등속 운동"],
      a: 0, why: "수평 방향으로는 작용하는 힘이 없어 같은 시간에 같은 거리를 가고(등속), 연직 방향으로는 중력만 받아 그냥 놓은 공과 똑같이 자유 낙하합니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "지구에서 가만히 놓은 돌이 처음 1초 동안 4.9 m 떨어졌습니다. 놓은 뒤 2초 동안 떨어진 거리와 2초 뒤의 속력을 바르게 짝지은 것은? (공기 저항 무시)",
      opts: ["9.8 m, 9.8 m/s", "19.6 m, 19.6 m/s", "19.6 m, 9.8 m/s", "9.8 m, 19.6 m/s"],
      a: 1, why: "거리는 시간의 제곱에 비례하므로(h = ½gt²) 2초 동안 4.9 × 4 = 19.6 m, 속력은 v = gt = 9.8 × 2 = 19.6 m/s입니다. 시간이 2배라고 거리도 2배가 되는 것은 아닙니다." },
    { lv: "발전", type: "short", ref: 7, unit: "초",
      q: "달의 중력 가속도는 1.62 m/s²입니다. 달 표면에서 높이 12.96 m인 곳에서 놓은 망치는 몇 초 만에 바닥에 닿을까요?",
      a: ["4", "4.0", "4.00", "약4"], why: "h = ½gt²에서 t = √(2h/g) = √(2 × 12.96 ÷ 1.62) = √16 = 4초입니다. 망치의 질량은 계산에 들어가지 않습니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "높이 20 m인 곳에서 공 A는 5 m/s, 공 B는 10 m/s로 수평으로 던졌습니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은? (공기 저항 무시)",
      box: "ㄱ. 땅에 닿는 데 걸리는 시간은 B가 A의 2배이다.<br>ㄴ. 수평으로 날아간 거리는 B가 A의 2배이다.<br>ㄷ. 땅에 닿을 때까지 연직 방향으로 늘어난 속력은 A와 B가 같다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 3, why: "연직 방향 운동은 둘 다 같은 자유 낙하라서 걸리는 시간(약 2.02초)과 연직 속력 변화가 같습니다(ㄱ 틀림, ㄷ 맞음). 시간이 같으니 수평 거리는 수평 속도에 비례해 A 약 10.1 m, B 약 20.2 m로 2배입니다(ㄴ 맞음)." },
    { lv: "심화", type: "mc", ref: 11,
      q: "지구 주위를 원궤도로 도는 인공위성이 땅으로 떨어지지 않는 까닭으로 가장 알맞은 것은?",
      opts: ["높은 곳에는 중력이 작용하지 않아 그대로 떠 있다",
             "지구 쪽으로 계속 떨어지지만, 수평 속도가 커서 떨어지는 만큼 지표가 휘어 나가 땅에 닿지 않는다",
             "엔진으로 늘 위쪽으로 밀어 올려 중력을 이기고 있다",
             "빠르게 움직이는 물체에는 중력이 약하게 작용한다"],
      a: 1, why: "인공위성도 중력을 받아 끝없이 떨어지고 있습니다. 지표 근처에서 약 7.9 km/s로 날면 1초 동안 4.9 m 떨어지는 사이 지표도 약 4.9 m 낮아져 높이가 그대로입니다. 중력이 없다면 곧장 날아가 버립니다." },
    { lv: "심화", type: "essay", ref: 4,
      q: "공기 중에서 깃털이 쇠공보다 훨씬 늦게 떨어지는 것을 보고 한 친구가 ‘무거운 물체일수록 빨리 떨어진다’고 결론 내렸습니다. 공기 저항과 진공 통 실험 결과를 근거로 이 결론의 잘못을 설명하세요.",
      model: "공기 중에서 떨어지는 물체는 빨라질수록 공기 저항을 크게 받는다. 넓고 가벼운 깃털은 공기 저항이 금세 중력과 같아져 종단 속도(약 1.3 m/s)로 천천히 내려오기 때문에 늦다. 공기를 모두 뺀 진공 통에서는 쇠공과 깃털이 매 순간 같은 높이로 떨어져 동시에 닿았다. 따라서 깃털이 늦은 까닭은 무게가 아니라 공기 저항이고, 자유 낙하는 질량과 관계없이 중력 가속도로만 정해진다.",
      rubric: ["깃털이 늦은 까닭을 공기 저항(또는 종단 속도)으로 설명했다", "진공에서 두 물체가 동시에 떨어진다는 실험 결과를 근거로 들었다", "자유 낙하는 질량과 관계없이 중력 가속도로 정해진다고 결론지었다"] }
  ]
};
</script>
