window.FORMATIVE = {

             "사람의 세포 < 원자 < 원자핵 < 지구",
             "원자핵 < 사람의 세포 < 원자 < 지구"],
      a: 0, why: "원자핵 약 10⁻¹⁵ m, 원자 약 10⁻¹⁰ m, 사람의 세포 약 10⁻⁵ m, 지구의 지름 약 10⁷ m입니다. 원자핵은 원자 속에 있으므로 원자보다 작습니다." },
    { lv: "기본", type: "short", ref: 4,
      q: "1 mm = 0.001 m입니다. 0.001을 10ⁿ 꼴로 나타낼 때 지수 n은 얼마일까요?",

    { lv: "기본", type: "mc", ref: 11,
      q: "1 광년에 대한 설명으로 옳은 것은?",

             "별빛이 지구에 오는 데 걸리는 시간을 재는 단위이다"],

    { lv: "심화", type: "mc", ref: 7,
      q: "관측 가능한 우주(약 10²⁶ m)의 크기는 태양계(약 10¹³ m)의 몇 배일까요?",
      opts: ["2배", "13배", "10² 배", "10¹³ 배"],
      a: 3, why: "26 − 13 = 13이므로 10¹³ 배입니다. 지수 26이 13의 2배라고 해서 크기가 2배인 것이 아니며, 지수를 나눈 10² 배도 아닙니다. 지수가 1 차이 날 때마다 10배씩 차이 납니다." },

      rubric: ["2.4×10²² m(또는 약 10²² m)로 어림했다", "m로 쓰면 숫자가 너무 커 다루기 어렵다는 점을 썼다", "광년은 빛이 가는 시간으로 거리를 나타내 비교·실감이 쉽다는 점을 썼다"] }
  ]
