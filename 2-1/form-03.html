<script>
/* 형성평가 — 통합과학1 Ⅱ-1 03 원소의 존재비(우주 · 탈출 속도 · 지각과 규산염 · 생명체 구성 원소). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅱ-1 자연의 구성 원소", part: "03 원소의 존재비",
  std: ["10통과1-02-01", "10통과1-02-02"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 9,
      q: "지각을 이루는 원소 가운데 질량비가 가장 큰 원소는?",
      opts: ["수소", "산소", "규소", "철"],
      a: 1, why: "지각은 산소 46.6%, 규소 27.7%, 알루미늄 8.1%, 철 5.0% 순입니다. 우주에서 가장 흔한 수소는 지각에 0.14%뿐입니다." },
    { lv: "기본", type: "short", ref: 7,
      q: "천체의 중력을 벗어나 우주로 나가는 데 필요한 속력을 무엇이라고 할까요?",
      a: ["탈출 속도", "탈출속도"],
      why: "탈출 속도는 질량이 큰 천체일수록 큽니다(달 2.38, 지구 11.2, 목성 59.5 km/s). 기체 분자의 평균 속력이 이 값의 6분의 1을 넘으면 오랜 세월에 걸쳐 달아납니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "사람 몸을 이루는 원소를 질량비가 큰 것부터 바르게 늘어놓은 것은?",
      opts: ["탄소 > 산소 > 수소", "수소 > 산소 > 탄소", "산소 > 탄소 > 수소", "산소 > 규소 > 탄소"],
      a: 2, why: "사람 몸은 산소 65%, 탄소 18.5%, 수소 9.5%, 질소 3.2% 순입니다. 몸의 많은 부분이 물이라 산소가 가장 많고, 탄소 화합물의 뼈대인 탄소가 2위입니다. 규소는 0.002%뿐입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "기체 분자의 평균 속력이 천체 탈출 속도의 6분의 1을 넘으면 그 기체가 달아난다고 할 때, 〈보기〉에서 옳은 것만을 있는 대로 고른 것은? (대기 바깥층 1,000 K의 평균 속력: 수소 3.53, 헬륨 2.50, 질소 0.94 km/s / 탈출 속도: 달 2.38, 지구 11.2, 목성 59.5 km/s)",
      box: "ㄱ. 지구는 헬륨을 붙잡지 못한다.<br>ㄴ. 달은 질소를 붙잡을 수 있다.<br>ㄷ. 목성은 수소를 붙잡을 수 있다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "기준선은 탈출 속도 ÷ 6입니다. 지구 1.87 km/s < 헬륨 2.50 → 달아남(ㄱ). 달 0.40 km/s < 질소 0.94 → 달아남(ㄴ 틀림). 목성 9.92 km/s > 수소 3.53 → 붙잡음(ㄷ)." },
    { lv: "발전", type: "short", ref: 7, unit: "km/s",
      q: "화성의 탈출 속도는 5.03 km/s입니다. ‘6분의 1’ 기준을 쓰면, 평균 속력이 몇 km/s를 넘는 기체가 화성에서 달아날까요? (소수 셋째 자리에서 반올림해 둘째 자리까지)",
      a: ["0.84", "약0.84"],
      why: "5.03 ÷ 6 ≈ 0.838 → 0.84 km/s입니다. 1,000 K에서 질소(0.94)·산소(0.88)는 이보다 빨라 달아나고, 이산화 탄소(0.75)는 남습니다." },
    { lv: "발전", type: "mc", ref: 11,
      q: "표는 세 시료의 원소 질량 백분율입니다. 이 자료에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "<table style='border-collapse:collapse;width:100%;font-size:13px'><tr><th style='text-align:left'>원소</th><th>우주</th><th>지각</th><th>사람 몸</th></tr><tr><td>수소</td><td>73.8%</td><td>0.14%</td><td>9.5%</td></tr><tr><td>탄소</td><td>0.24%</td><td>0.02%</td><td>18.5%</td></tr><tr><td>규소</td><td>0.07%</td><td>27.7%</td><td>0.002%</td></tr></table>ㄱ. 규소의 비율은 지각이 사람 몸의 1만 배가 넘는다.<br>ㄴ. 탄소의 비율은 사람 몸이 우주보다 크다.<br>ㄷ. 수소는 세 시료 모두에서 가장 많은 원소이다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "규소 27.7 ÷ 0.002 = 13,850배(ㄱ). 탄소는 사람 몸 18.5%로 우주 0.24%의 약 77배(ㄴ). 지각의 1위는 산소, 사람 몸의 1위도 산소입니다(ㄷ 틀림)." },
    { lv: "심화", type: "mc", ref: 5,
      q: "우주 시료에서 수소와 헬륨만 모두 날려 보낸다면, 남은 원소 가운데 질량비 1위인 원소와 그 원소가 지각·사람 몸에서 차지하는 순위를 바르게 짝지은 것은?",
      opts: ["탄소 — 지각 1위, 사람 몸 2위", "산소 — 지각 1위, 사람 몸 1위", "철 — 지각 1위, 사람 몸 3위", "네온 — 지각 2위, 사람 몸 4위"],
      a: 1, why: "수소·헬륨을 걷어 내면 산소가 약 43%로 1위, 탄소가 약 18%로 2위가 됩니다. 산소는 지각(46.6%)과 사람 몸(65%)에서도 1위입니다. 지구와 생명의 재료는 우주의 조성에서 가벼운 기체가 빠진 것에서 출발했습니다. 네온은 결합하지 않는 기체라 지각에 거의 없습니다." },
    { lv: "심화", type: "essay", ref: 13,
      q: "우주 → 지각 → 사람 몸으로 가며 원소 존재비가 달라진 까닭을, ‘지구가 걸러 낸 것’과 ‘생명체가 골라 모은 것’ 두 단계로 나누어 설명하세요. (탈출 속도, 규산염, 탄소 화합물을 넣어 쓰기)",
      model: "우주는 빅뱅이 만든 수소·헬륨이 98.7%이다. 지구에서는 가벼운 수소·헬륨 분자의 평균 속력이 탈출 속도의 6분의 1을 넘어 우주로 달아났고, 남은 원소 가운데 산소가 규소와 결합해 녹는점이 높은 규산염 암석이 되어 지각은 산소 46.6%, 규소 27.7%가 되었다. 생명체는 물과 탄소 화합물로 몸을 지어 산소·탄소·수소·질소가 96% 이상이 되었고, 암석의 재료인 규소는 거의 쓰지 않는다.",
      rubric: ["가벼운 수소·헬륨이 탈출 속도(6분의 1 기준)를 넘어 달아났다고 썼다", "산소와 규소가 규산염 암석을 이루어 지각의 대부분이 되었다고 썼다", "생명체가 물과 탄소 화합물로 산소·탄소·수소·질소를 모았다고 썼다"] }
  ]
};
</script>
