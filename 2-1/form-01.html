<title>형성평가 · 빅뱅과 원소의 생성 (통합과학1 Ⅱ-1 01)</title>

</head>
<body>
<script>
/* 형성평가 — 통합과학1 Ⅱ-1 01 빅뱅과 원소의 생성(스펙트럼 · 빅뱅의 증거 · 빅뱅 핵합성). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅱ-1 자연의 구성 원소", part: "01 빅뱅과 원소의 생성",
  std: ["10통과1-02-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "별빛을 분광기로 펼쳤더니 무지개 띠 위에 검은 선이 여러 개 나타났습니다. 이 스펙트럼의 종류는?",
      opts: ["연속 스펙트럼", "방출 스펙트럼", "흡수 스펙트럼"],
      a: 2, why: "연속 스펙트럼의 빛이 별 바깥 대기처럼 더 차가운 기체를 지날 때, 기체 속 원소가 특정 파장만 흡수해 검은 선이 생깁니다. 이것이 흡수 스펙트럼입니다. 방출 스펙트럼은 어두운 바탕에 밝은 선이 나타납니다." },
    { lv: "기본", type: "short", ref: 8,
      q: "전파 망원경을 하늘의 어느 방향으로 돌려도 똑같이 들어오는, 온도 약 2.7 K에 해당하는 복사를 무엇이라고 할까요?",
      a: ["우주 배경 복사", "우주배경복사", "우주 마이크로파 배경 복사", "우주 마이크로파 배경복사"],
      why: "약 38만 년에 우주가 3,000 K 아래로 식어 원자가 생기자 풀려난 빛이, 우주가 팽창하는 동안 식어 지금 2.7 K로 관측됩니다. 빅뱅의 증거입니다." },
    { lv: "기본", type: "mc", ref: 12,
      q: "빅뱅 뒤 약 3분 동안의 빅뱅 핵합성으로 만들어진 원소만 바르게 모은 것은?",
      opts: ["수소, 헬륨, 아주 적은 양의 리튬", "수소, 탄소, 산소", "헬륨, 규소, 철", "수소부터 철까지 모든 원소"],
      a: 0, why: "질량수 5와 8에 안정한 원자핵이 없어 빅뱅 핵합성은 수소·헬륨과 아주 약간의 리튬에서 멈췄습니다. 탄소·산소·규소·철은 나중에 별에서 만들어졌습니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "햇빛의 스펙트럼과 헬륨의 발견에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 햇빛은 눈에는 끊김 없는 무지개로 보이지만, 분광기로 보면 검은 흡수선이 수백 개 넘게 있다.<br>ㄴ. 같은 원소라면 밝은 선과 검은 선이 놓이는 파장이 같다.<br>ㄷ. 헬륨은 지구에서 먼저 발견된 뒤 1868년 일식 때 태양에서 확인되었다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "햇빛을 연속 스펙트럼으로 여기기 쉽지만 실제로는 프라운호퍼선이라는 흡수선이 많습니다(ㄱ). 선의 파장은 원소마다 정해져 있어 방출선과 흡수선의 자리가 같습니다(ㄴ). 헬륨은 1868년 태양에서 먼저 발견되고, 지구에서는 27년 뒤인 1895년에 찾았습니다(ㄷ 틀림)." },
    { lv: "발전", type: "mc", ref: 5,
      q: "그림은 어느 별 X의 흡수 스펙트럼과, 실험실에서 얻은 원소 A, B, C의 방출 스펙트럼입니다. 별 X의 대기에 들어 있다고 판단할 수 있는 원소만 고른 것은?",
      fig: (function () {
        var X0 = 70, W = 340, s = "<svg viewBox='0 0 430 210' width='430' height='210' aria-label='별 X의 흡수 스펙트럼과 원소 A, B, C의 방출 스펙트럼. 별 X의 검은 선 다섯 개는 A의 선 세 개, C의 선 두 개와 같은 자리에 있다'>";
        function X(nm) { return X0 + (nm - 400) / 300 * W; }
        function row(y, lab, kind, L) {
          var r = "<text x='" + (X0 - 8) + "' y='" + (y + 22) + "' font-size='14' font-weight='700' text-anchor='end'>" + lab + "</text>";
          r += kind === "abs" ? "<rect x='" + X0 + "' y='" + y + "' width='" + W + "' height='32' fill='#e8edf4' stroke='#5f6b80'/>" : "<rect x='" + X0 + "' y='" + y + "' width='" + W + "' height='32' fill='#222'/>";
          L.forEach(function (nm) { r += "<rect x='" + (X(nm) - 2) + "' y='" + y + "' width='4' height='32' fill='" + (kind === "abs" ? "#111" : "#ffe066") + "'/>"; });
          return r;
        }
        s += row(8, "별 X", "abs", [430, 450, 520, 610, 640]);
        s += row(54, "원소 A", "emis", [430, 520, 610]);
        s += row(100, "원소 B", "emis", [470, 560, 680]);
        s += row(146, "원소 C", "emis", [450, 640]);
        [400, 500, 600, 700].forEach(function (nm) { s += "<text x='" + X(nm) + "' y='198' font-size='12' text-anchor='" + (nm === 700 ? "end" : "middle") + "'>" + nm + (nm === 700 ? " nm" : "") + "</text>"; });
        s += "</svg>";
        return s;
      })(),
      opts: ["A", "B", "A, B", "A, C", "A, B, C"],
      a: 3, why: "선이 놓이는 파장은 원소의 지문입니다. 별 X의 검은 선 다섯 개는 A의 밝은 선 세 개(430·520·610 nm), C의 선 두 개(450·640 nm)와 자리가 같습니다. B의 선은 별 X에 없습니다. (원소 A, B, C는 설명을 위한 가상의 원소입니다.)" },
    { lv: "발전", type: "mc", ref: 11,
      q: "빅뱅 핵합성에서 탄소가 거의 만들어지지 않은 까닭으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 질량수 5와 8에는 안정한 원자핵이 없다.<br>ㄴ. 우주가 몇 분 만에 식고 성글어져, 헬륨 셋이 거의 동시에 부딪칠 기회가 없었다.<br>ㄷ. 그때 우주에는 양성자가 거의 없었다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "한 칸씩 올라가는 길이 질량수 5와 8에서 끊겨 있었고(ㄱ), 벽을 건너뛰어 탄소를 만들려면 헬륨 셋이 거의 동시에 부딪치는 일이 오래 뜨거운 곳에서 일어나야 합니다(ㄴ). 양성자는 넘쳐났습니다. 지금도 우주 질량의 약 4분의 3이 수소입니다(ㄷ 틀림)." },
    { lv: "심화", type: "short", ref: 10, unit: "%",
      q: "빅뱅 뒤 중성자가 모두 헬륨 원자핵(양성자 2 + 중성자 2)에 묶였다고 합시다. 만약 그때 중성자 : 양성자 = 1 : 5였다면, 헬륨의 질량비는 약 몇 %가 되었을까요? (양성자와 중성자의 질량은 같다고 보고, 소수 첫째 자리에서 반올림해 정수로)",
      a: ["33", "약33", "33.3"],
      why: "핵자 12개라면 중성자 2개, 양성자 10개입니다. 중성자 2개가 양성자 2개와 함께 헬륨 하나(핵자 4개)가 되므로 4 ÷ 12 ≈ 33%입니다. 실제(1 : 7)에서는 4 ÷ 16 = 25%로, 중성자가 적을수록 헬륨도 적어집니다." },
    { lv: "심화", type: "essay", ref: 13,
      q: "‘우주 배경 복사’와 ‘우주 어디서나 같은 수소 : 헬륨 질량비(약 3 : 1)’가 각각 빅뱅 우주론의 증거가 되는 까닭을, 빅뱅 뒤 어느 때에 무슨 일이 있었는지를 넣어 설명하세요.",
      model: "빅뱅 뒤 약 3분, 우주가 약 10억 K로 식었을 때 중성자 : 양성자가 약 1 : 7이었고 중성자가 거의 모두 헬륨에 묶여 헬륨 질량비가 약 25%로 정해졌다. 별과 상관없이 우주 전체에서 이때 정해졌으므로 어디서나 3 : 1이 나온다. 또 약 38만 년에 3,000 K 아래로 식어 원자가 생기자 빛이 풀려났고, 이 빛이 우주가 팽창하는 동안 식어 지금 하늘 어디서나 2.7 K의 우주 배경 복사로 보인다. 빅뱅 이론이 예측한 것과 관측이 맞아떨어지므로 증거가 된다.",
      rubric: ["3 : 1이 빅뱅 뒤 약 3분의 빅뱅 핵합성에서 정해졌다고 썼다", "우주 배경 복사가 약 38만 년에 풀려난 빛이 팽창으로 식은 것이라고 썼다", "이론의 예측과 관측이 일치해 증거가 된다는 논리로 마무리했다"] }
  ]
};
</script>
