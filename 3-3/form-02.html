<script>
/* 형성평가 — 통합과학1 Ⅲ-3 02 동화 작용과 이화 작용(물질대사 · 동화 작용 · 이화 작용 · 세포 호흡 · ATP · 기초 대사량). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-3 생명 시스템", part: "02 동화 작용과 이화 작용",
  std: ["10통과1-03-05"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 6,
      q: "이화 작용에 대한 설명으로 옳은 것은?",
      opts: ["작은 분자를 이어 큰 분자를 만들며 에너지를 흡수한다", "큰 분자를 작은 분자로 쪼개며 에너지를 방출한다", "산소를 쓰는 반응만 이화 작용이다", "식물에서만 일어난다"],
      a: 1, why: "이화 작용은 크고 복잡한 물질을 작고 간단한 물질로 분해하며 에너지를 내놓습니다. 세포 호흡·소화가 예이고, 산소 없이 일어나는 발효도 이화 작용입니다." },
    { lv: "기본", type: "short", ref: 4,
      q: "세포 호흡으로 포도당에서 나온 에너지의 일부가 담겨, 근육 운동이나 단백질 합성에 바로 쓰이는 물질은 무엇일까요?",
      a: ["ATP", "에이티피", "아데노신삼인산", "아데노신 삼인산"], why: "ATP입니다. 이화 작용에서 나온 에너지가 ATP에 담겨 동화 작용 같은 생명 활동에 쓰입니다." },
    { lv: "기본", type: "mc", ref: 8,
      q: "다음 가운데 동화 작용에 해당하는 것은?",
      opts: ["소장에서 단백질이 아미노산으로 분해된다", "근육 세포가 포도당을 분해해 에너지를 얻는다", "식물이 이산화 탄소와 물로 포도당을 만든다", "달릴 때 저장해 둔 지방을 꺼내 쓴다"],
      a: 2, why: "광합성은 작고 간단한 물질(이산화 탄소, 물)로 크고 복잡한 포도당을 만들며 빛에너지를 흡수하는 동화 작용입니다. 나머지는 모두 쪼개는 이화 작용입니다." },
    { lv: "발전", type: "short", ref: 5, unit: "g",
      q: "단원 화면 계량기에서 포도당 30 g을 세포 호흡으로 모두 분해하자 이산화 탄소 44 g과 물 18 g이 나왔습니다. 이때 함께 쓰인 산소는 몇 g일까요?",
      a: ["32", "32g", "약32"], why: "질량은 보존됩니다. 나온 질량 44 + 18 = 62 g이므로 들어간 산소는 62 − 30 = 32 g입니다. 이산화 탄소가 포도당보다 무거운 까닭이 바로 이 산소입니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "아미노산 30개를 이어 사슬 하나를 만들 때에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은? (결합 하나에 ATP 약 4개로 계산)",
      box: "ㄱ. 펩타이드 결합은 29개 생긴다.<br>ㄴ. 물 30분자가 빠져나온다.<br>ㄷ. ATP가 약 116개 쓰인다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "n개를 이으면 결합과 빠지는 물은 n − 1 = 29개입니다(ㄱ 맞음, ㄴ 틀림). ATP는 29 × 4 = 116개쯤 듭니다(ㄷ 맞음)." },
    { lv: "발전", type: "mc", ref: 11,
      q: "하루 소비가 약 2,453 kcal인 학생이 매일 3,000 kcal를 먹습니다. 지방 1 kg을 7,700 kcal로 칠 때 30일 뒤 몸무게 변화로 가장 가까운 것은? (단원 화면 계산 방식)",
      opts: ["약 0.2 kg 증가", "약 2.1 kg 증가", "약 2.1 kg 감소", "약 7.1 kg 증가"],
      a: 1, why: "하루 차이 3,000 − 2,453 = 547 kcal, 30일이면 약 16,410 kcal입니다. 16,410 ÷ 7,700 ≈ 2.1 kg이 지방으로 저장(동화 작용)되어 늘어납니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "운동으로 지방 10 kg을 뺀 사람에게 그 지방의 질량이 주로 어디로 갔는지 물었습니다. 가장 알맞은 답은?",
      opts: ["에너지로 바뀌어 질량이 사라졌다",
             "땀으로 녹아 대부분 빠져나갔다",
             "세포 호흡으로 대부분 이산화 탄소가 되어 날숨으로 나갔다",
             "근육으로 바뀌어 몸에 그대로 남았다"],
      a: 2, why: "지방의 원자는 사라지지 않고 세포 호흡을 거쳐 이산화 탄소와 물이 됩니다. 질량의 약 84 %가 날숨 속 이산화 탄소로 나갑니다. 에너지는 물질이 아니어서 질량을 가져가지 못합니다." },
    { lv: "심화", type: "essay", ref: 9,
      q: "근육 운동을 꾸준히 하면 근육이 커집니다. 이때 몸속에서 이화 작용과 동화 작용이 각각 어떤 일을 하고 서로 어떻게 이어지는지, ‘분자 크기’와 ‘에너지’라는 말을 넣어 설명하세요.",
      model: "이화 작용(세포 호흡)으로 포도당 같은 큰 분자를 이산화 탄소와 물 같은 작은 분자로 쪼개며 에너지를 방출하고, 그 일부를 ATP에 담는다. 동화 작용으로 작은 아미노산을 이어 큰 근육 단백질을 만드는데, 이때 ATP의 에너지를 흡수해 쓴다. 이렇게 이화 작용에서 나온 에너지가 ATP를 거쳐 동화 작용에 쓰이며, 두 작용을 합쳐 물질대사라 한다.",
      rubric: ["이화 작용을 큰 분자 → 작은 분자, 에너지 방출로 설명했다", "동화 작용을 작은 분자(아미노산) → 큰 분자(단백질), 에너지 흡수로 설명했다", "이화 작용의 에너지가 ATP를 거쳐 동화 작용에 쓰인다고 연결했다"] }
  ]
};
</script>
