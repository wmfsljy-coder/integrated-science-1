<!DOCTYPE html>

<title>형성평가 · 뉴턴 운동 법칙 (통합과학1 Ⅲ-2 02)</title>
<link rel="icon" href="https://wmfsljy-coder.github.io/science-teacher-hub-qtrqwc/assets/hub-icon.svg" type="image/svg+xml">
</head>
<body>
<script>
/* 형성평가 — 통합과학1 Ⅲ-2 02 뉴턴 운동 법칙(관성 · 엘리베이터 저울 · 가속도의 법칙 · 작용 반작용). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-2 역학 시스템", part: "02 뉴턴 운동 법칙",
  std: ["10통과1-03-04"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "마찰이 없는 얼음판 위를 미끄러지던 퍽에 작용하는 알짜힘이 0입니다. 이 퍽의 운동으로 옳은 것은?",
      opts: ["점점 느려지다가 멈춘다", "같은 빠르기로 곧게 계속 움직인다", "그 자리에서 곧바로 멈춘다", "점점 빨라진다"],
      a: 1, why: "알짜힘이 0이면 물체는 가속되지 않습니다. 정지해 있던 물체는 계속 정지하고, 움직이던 물체는 등속 직선 운동을 계속합니다(관성의 법칙). 움직이려면 힘이 계속 필요하다는 생각은 오개념입니다." },
    { lv: "기본", type: "mc", ref: 5,
      q: "관성에 대한 설명으로 옳은 것은?",
      opts: ["빠르게 달리는 물체일수록 관성이 크다", "질량이 큰 물체일수록 관성이 크다", "무게를 느낄 수 없는 우주 정거장 안에서는 관성이 없다", "정지해 있는 물체에는 관성이 없다"],
      a: 1, why: "관성의 크기는 질량으로만 정해집니다. 같은 물체라면 정지해 있을 때나 빨리 달릴 때나 관성이 같고, 우주 정거장 안에서도 질량은 그대로이므로 관성도 그대로입니다. 빨리 달리는 물체가 멈추기 어려운 것은 운동량이 크기 때문입니다." },
    { lv: "기본", type: "short", ref: 13,
      q: "천장에 매달린 전등에 작용하는 중력과 줄이 전등을 당기는 힘처럼, 한 물체에 작용하여 서로 비기는 두 힘을 무엇이라고 할까요?",
      a: ["평형력", "힘의 평형", "평형"], why: "두 힘이 모두 전등 하나에 작용하므로 평형력입니다. 작용 반작용은 힘을 주고받는 서로 다른 두 물체에 하나씩 작용한다는 점이 다릅니다." },
    { lv: "발전", type: "short", ref: 9, unit: "kg중",
      q: "질량 50 kg인 학생이 엘리베이터 안 체중계 위에 서 있습니다. 엘리베이터가 아래쪽으로 1.96 m/s²의 가속도로 움직일 때 체중계 눈금은 몇 kg중일까요? (g = 9.8 m/s², 1 kg중 = 9.8 N)",
      a: ["40", "약40"], why: "위쪽을 +로 하면 a = −1.96 m/s²입니다. N = m(g + a) = 50 × (9.8 − 1.96) = 50 × 7.84 = 392 N이고, 392 ÷ 9.8 = 40 kg중입니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "질량 4 kg인 상자를 바닥에서 수평으로 20 N의 힘으로 밀었더니 마찰력이 8 N 작용했습니다. 상자의 가속도는?",
      opts: ["2 m/s²", "3 m/s²", "5 m/s²", "7 m/s²"],
      a: 1, why: "가속도를 정하는 것은 알짜힘입니다. 알짜힘 = 20 − 8 = 12 N, a = 12 ÷ 4 = 3 m/s²입니다. 20 ÷ 4 = 5 m/s²는 마찰력을 빠뜨린 값입니다." },
    { lv: "발전", type: "mc", ref: 12,
      q: "마찰이 없는 얼음판 위에 정지해 있던 A(50 kg)와 B(100 kg)가 서로 밀어 반대 방향으로 밀려났습니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. A가 B를 미는 힘과 B가 A를 미는 힘의 크기는 같다.<br>ㄴ. 밀고 난 뒤 A의 속력은 B의 속력의 2배이다.<br>ㄷ. 질량이 큰 B가 A를 더 큰 힘으로 민다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "두 힘은 작용 반작용이라 크기가 같고 미는 시간도 같습니다(ㄱ 맞음, ㄷ 틀림). 같은 크기의 힘을 받아도 가속도는 질량에 반비례하므로 질량이 절반인 A의 속력이 B의 2배입니다(ㄴ 맞음)." },
    { lv: "심화", type: "mc", ref: 8,
      q: "그림은 1층에서 출발해 위로 올라가는 엘리베이터의 속도를 시간에 따라 나타낸 것입니다. 구간 A, B, C에서 엘리베이터 안 체중계의 눈금을 바르게 비교한 것은?",
      fig: (function () {
        var s = "<svg viewBox='0 0 420 210' width='420' height='210' aria-label='속도-시간 그래프: 구간 A에서 속도가 늘고, B에서 일정하고, C에서 줄어 0이 된다'>";
        s += "<line x1='50' y1='170' x2='400' y2='170' stroke='#161b28' stroke-width='2'/><line x1='50' y1='20' x2='50' y2='170' stroke='#161b28' stroke-width='2'/>";
        s += "<polyline points='50,170 160,60 290,60 400,170' fill='none' stroke='#1462d8' stroke-width='3'/>";
        s += "<g stroke='#9aa4b5' stroke-dasharray='4 4'><line x1='160' y1='60' x2='160' y2='170'/><line x1='290' y1='60' x2='290' y2='170'/></g>";
        s += "<g font-size='15' font-weight='800' text-anchor='middle'><text x='105' y='160'>A</text><text x='225' y='160'>B</text><text x='345' y='160'>C</text></g>";
        s += "<text x='400' y='192' font-size='13' text-anchor='end'>시간</text><text x='8' y='14' font-size='13'>속도 (위쪽)</text></svg>";
        return s;
      })(),
      opts: ["A > B > C", "A = B = C", "A < B < C", "B > A = C"],
      a: 0, why: "A에서는 위로 가속(a > 0)하므로 N = m(g + a)가 커지고, B에서는 일정한 속도(a = 0)라 실제 질량 그대로, C에서는 위로 가면서 느려지므로 가속도가 아래쪽(a < 0)이라 작아집니다. 눈금을 정하는 것은 속도가 아니라 가속도입니다." },
    { lv: "심화", type: "essay", ref: 9,
      q: "우주 정거장 안에서 우주인이 둥둥 떠 있는 모습을 보고 한 친구가 ‘우주 정거장에는 중력이 작용하지 않는다’고 말했습니다. 줄이 끊어진 엘리베이터 안 체중계의 눈금과 비교하여 이 말의 잘못을 설명하세요.",
      model: "줄이 끊어진 엘리베이터는 a = −9.8 m/s²로 자유 낙하하므로 N = m(g + a) = 0이 되어 체중계 눈금이 0이 된다. 이때도 중력은 그대로 작용하지만, 사람과 엘리베이터가 함께 떨어져 바닥이 몸을 떠받치지 않을 뿐이다. 우주 정거장도 지구의 중력을 받아 사람과 함께 끝없이 떨어지고 있으므로 떠 있는 것처럼 보인다. 따라서 중력이 없는 것이 아니다.",
      rubric: ["자유 낙하하는 엘리베이터에서 떠받치는 힘(눈금)이 0이 된다는 점을 썼다", "이때도 중력은 작용하며 사람과 엘리베이터가 함께 떨어진다고 설명했다", "우주 정거장도 중력을 받아 함께 떨어지고 있어 떠 보인다고 연결했다"] }
  ]
};
</script>
