<script>
/* 형성평가 — 통합과학1 Ⅱ-2 01 원소의 주기성(원자가 전자 · 주기성 · 이온화 에너지 · 원자 반지름 · 빈칸 예측 · 족의 행동). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅱ-2 물질의 규칙성과 성질", part: "01 원소의 주기성",
  std: ["10통과1-02-03"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "나트륨 원자의 전자 배치는 (2, 8, 1)입니다. 나트륨에 대한 설명으로 옳은 것은?",
      opts: ["3주기 1족 원소이다", "원자가 전자가 8개이다", "2주기 1족 원소이다", "18족 원소처럼 가장 바깥 껍질이 꽉 차 있다"],
      a: 0, why: "전자 껍질이 3개이므로 3주기, 가장 바깥 껍질의 전자(원자가 전자)가 1개이므로 1족입니다. 원자가 전자는 껍질 전체의 전자가 아니라 가장 바깥 껍질의 전자만 셉니다." },
    { lv: "기본", type: "short", ref: 5,
      q: "원소를 원자 번호 순서로 늘어놓으면 원자가 전자 수가 1, 2, … 7, 0으로 바뀐 뒤 다시 1부터 시작합니다. 이처럼 성질이 일정한 간격으로 되풀이되는 것을 무엇이라고 할까요?",
      a: ["주기성", "원소의 주기성"], why: "원자가 전자 수가 되풀이되므로 원자가 전자가 정하는 화학적 성질도 함께 되풀이됩니다. 이것이 주기성이고, 같은 족 원소가 서로 닮은 까닭입니다." },
    { lv: "기본", type: "mc", ref: 11,
      q: "헬륨·네온·아르곤 같은 18족 원소가 다른 원소와 거의 반응하지 않는 까닭은?",
      opts: ["원자량이 가장 크기 때문", "가장 바깥 전자 껍질이 전자로 꽉 차 있기 때문", "원자 반지름이 가장 크기 때문", "원자가 전자가 1개뿐이기 때문"],
      a: 1, why: "18족은 바깥 껍질이 꽉 차 있어(헬륨 2개, 네온·아르곤 8개) 전자를 주거나 받을 필요가 없습니다. 그래서 원자가 전자를 0으로 보고, 이온이 되려 하지 않습니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "표는 몇 원소의 이온화 에너지입니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "<b>이온화 에너지 (kJ/mol)</b> &nbsp; 리튬 520 · 나트륨 496 · 칼륨 419 &nbsp;|&nbsp; 헬륨 2372 · 네온 2081 · 아르곤 1521<br>ㄱ. 같은 주기에서는 18족 원소의 이온화 에너지가 가장 크다.<br>ㄴ. 1족 원소는 아래로 갈수록 전자를 떼어 내기 어려워진다.<br>ㄷ. 칼륨이 나트륨보다 물과 격렬하게 반응하는 것은 전자를 내주기 더 쉽기 때문이다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "ㄱ: 18족은 바깥 껍질이 꽉 차 있어 전자를 떼어 내기 가장 어렵습니다. ㄴ: 1족은 520 → 496 → 419로 아래로 갈수록 이온화 에너지가 작아지므로 전자를 떼어 내기 쉬워집니다. ㄷ: 전자를 쉽게 내줄수록 반응이 격렬합니다." },
    { lv: "발전", type: "short", ref: 8, unit: "",
      q: "멘델레예프의 방법으로 갈륨 칸의 원자량을 예측해 봅시다. 갈륨의 위는 알루미늄(26.98), 아래는 인듐(114.82), 왼쪽은 아연(65.38), 오른쪽은 저마늄(72.63)입니다. 네 이웃의 평균으로 예측한 원자량은? (소수 둘째 자리까지)",
      a: ["69.95", "약69.95", "69.9", "70.0", "70"], why: "(26.98 + 114.82 + 65.38 + 72.63) ÷ 4 = 279.81 ÷ 4 ≈ 69.95입니다. 실제 갈륨의 원자량 69.72와 아주 가깝습니다. 성질이 표를 따라 고르게 변하기 때문에 이웃으로 빈칸을 계산할 수 있습니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "3주기에서 나트륨(186 pm) → 염소(99 pm)로 갈수록 원자 반지름이 작아지는 까닭으로 옳은 것은?",
      opts: ["전자 껍질 수가 하나씩 줄어들기 때문", "핵의 양전하가 커져 같은 껍질의 전자를 더 세게 당기기 때문", "전자 수가 점점 줄어들기 때문", "오른쪽으로 갈수록 원자량이 작아지기 때문"],
      a: 1, why: "같은 주기의 원소는 전자 껍질 수가 같습니다. 오른쪽으로 갈수록 양성자 수(핵의 양전하)가 커져 바깥 전자를 더 세게 당기므로 반지름이 작아집니다. 전자 수와 원자량은 오히려 늘어납니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "칼륨(K)과 화학적 성질이 가장 비슷할 것으로 예상되는 원소와 그 까닭을 바르게 짝지은 것은?",
      opts: ["칼슘(Ca) — 칼륨과 같은 4주기이므로", "루비듐(Rb) — 칼륨과 원자가 전자 수가 1개로 같으므로", "아르곤(Ar) — 원자 번호가 칼륨 바로 앞이므로", "수소(H) — 같은 1족이므로 금속의 성질도 같으므로"],
      a: 1, why: "화학적 성질은 원자가 전자 수가 정하므로 같은 족 원소끼리 닮습니다. 루비듐은 칼륨 아래의 1족 알칼리 금속입니다. 같은 주기는 껍질 수만 같고, 수소는 1족에 두지만 금속이 아닙니다." },
    { lv: "심화", type: "essay", ref: 11,
      q: "알칼리 금속은 아래로 갈수록, 할로젠은 위로 갈수록 반응성이 큽니다. 두 족의 경향이 반대인 까닭을 ‘전자를 잃는다·얻는다’와 원자의 크기를 넣어 설명하세요.",
      model: "알칼리 금속은 원자가 전자 1개를 잃으며 반응한다. 아래로 갈수록 전자 껍질이 늘어 원자가 커지고 바깥 전자가 핵에서 멀어지므로 떼어 내기 쉬워(이온화 에너지 감소) 반응성이 커진다. 할로젠은 전자 1개를 얻으며 반응한다. 위로 갈수록 원자가 작아 핵이 바깥에서 들어오는 전자를 세게 끌어당기므로 전자를 잘 얻어 반응성이 크다.",
      rubric: ["알칼리 금속은 전자를 잃고 할로젠은 전자를 얻어 반응한다고 썼다", "아래로 갈수록 원자가 커져 바깥 전자를 떼어 내기 쉽다(이온화 에너지가 작다)고 설명했다", "위로 갈수록 원자가 작아 전자를 끌어당기는 힘이 커 전자를 잘 얻는다고 설명했다"] }
  ]
};
</script>
