<title>형성평가 · 효소와 화학 반응 (통합과학1 Ⅲ-3 01)</title>
<link rel="icon" href="https://wmfsljy-coder.github.io/science-teacher-hub-qtrqwc/assets/hub-icon.svg" type="image/svg+xml">
</head>
<body>
<script>
/* 형성평가 — 통합과학1 Ⅲ-3 01 효소와 화학 반응(효소 · 활성화 에너지 · 최적 온도 · 최적 pH · 변성 · 기질 특이성). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-3 생명 시스템", part: "01 효소와 화학 반응",
  std: ["10통과1-03-05"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "과산화 수소가 물과 산소로 분해되는 반응에 카탈레이스(효소)를 넣었습니다. 효소가 하는 일로 옳은 것은?",
      opts: ["반응이 넘어야 할 활성화 에너지를 낮춘다", "물과 산소 대신 다른 생성물이 나오게 한다", "반응물과 함께 쓰여 반응이 끝나면 없어진다", "반응물이 가진 에너지를 높여 준다"],
      a: 0, why: "효소는 언덕(활성화 에너지)을 75 kJ/mol에서 8 kJ/mol로 낮춰 속도만 바꿉니다. 생성물은 그대로이고, 효소는 반응에 쓰여 없어지지 않아 다시 쓰입니다." },
    { lv: "기본", type: "short", ref: 11,
      q: "효소의 홈에는 꼭 맞는 물질만 들어가, 효소는 짝이 맞는 기질에만 작용합니다. 이 성질을 무엇이라고 할까요?",
      a: ["기질 특이성", "기질특이성"], why: "기질 특이성입니다. 그래서 김치 속 효소는 옆에 둔 과산화 수소를 분해하지 못했고, 핏자국에는 단백질 분해 효소가 필요합니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "80 °C 국물을 부었다가 20 °C로 식힌 김치통 ㉰에서 효소에 일어난 일로 옳은 것은?",
      opts: ["온도가 내려가자 효소가 다시 접혀 원래대로 일한다", "단백질인 효소의 접힌 모양이 풀려(변성) 식혀도 돌아오지 않는다", "효소가 열을 받아 더 많이 만들어진다", "효소는 그대로이고 기질만 모두 없어졌다"],
      a: 1, why: "효소는 단백질이라 높은 열에 접힌 모양이 풀려 기질이 들어갈 홈이 사라집니다. 이것이 변성이고, 삶은 달걀처럼 식혀도 되돌아오지 않습니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "단원 화면의 김치 유산균 효소는 30 °C에서 가장 잘 일하고, 온도 활성이 −2 °C에서 약 3 %, 20 °C에서 약 71 %였습니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. −2 °C에서도 김치가 익는 반응은 일어난다.<br>ㄴ. 20 °C에서 30 °C로 옮기면 반응이 더 빨라진다.<br>ㄷ. −2 °C에 둔 효소는 변성되어 30 °C로 옮겨도 일하지 못한다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "−2 °C에서도 활성이 0이 아니어서 아주 느리게 익습니다(ㄱ). 30 °C가 최적 온도이므로 20 °C보다 빠릅니다(ㄴ). 낮은 온도는 효소를 변성시키지 않으므로 다시 데우면 잘 일합니다(ㄷ 틀림)." },
    { lv: "발전", type: "short", ref: 12,
      q: "단백질 분해 효소 세제로 핏자국을 빨 때 40 °C 물에서는 약 95 %가 지워졌는데, 같은 세제를 75 °C 물에서 쓰자 거의 지워지지 않았습니다(단원 화면 모형값). 효소에 일어난 이 일을 한 낱말로 쓰세요.",
      a: ["변성", "효소의 변성", "단백질 변성"], why: "효소(단백질)가 높은 열에 변성되어 기질(핏자국의 단백질)이 들어갈 홈이 사라졌기 때문입니다. 뜨거운 물이 늘 더 잘 지우는 것은 아닙니다." },
    { lv: "발전", type: "mc", ref: 13,
      q: "생활 속 효소와 그 효소가 분해하는 기질을 바르게 짝지은 것은?",
      opts: ["침 속 아밀레이스 — 지방", "위액 속 펩신 — 단백질", "이자액 속 라이페이스 — 녹말", "연육제 속 파파인 — 녹말"],
      a: 1, why: "펩신은 위액 속 단백질 분해 효소입니다(최적 pH 2 부근). 아밀레이스는 녹말, 라이페이스는 지방, 파파인은 고기의 단백질을 분해합니다." },
    { lv: "심화", type: "mc", ref: 5,
      q: "효소 없이 과산화 수소 분해를 빠르게 하려고 온도를 25 °C에서 80 °C로 올려도 약 110배 빨라질 뿐이지만, 25 °C 그대로 카탈레이스를 넣으면 약 5천억 배 빨라집니다(단원 화면 계산). 이 결과로 알 수 있는 것으로 가장 알맞은 것은?",
      opts: ["효소는 반응물의 온도를 크게 높여 반응을 빠르게 한다",
             "생물은 체온 정도의 온도에서도 효소로 활성화 에너지를 낮춰 반응을 빠르게 한다",
             "온도를 충분히 높이면 효소 없이도 언제나 효소만큼 빨라진다",
             "효소가 있으면 생성물이 더 많은 에너지를 가지게 된다"],
      a: 1, why: "온도를 올리는 방법은 몇 배~몇백 배에 그치고, 지나치게 높이면 몸의 단백질이 변성됩니다. 효소는 온도를 바꾸지 않고 언덕만 낮춰 체온에서도 반응을 1억 배 넘게 빠르게 합니다." },
    { lv: "심화", type: "essay", ref: 10,
      q: "김치냉장고(−2 °C)에 3주 둔 김치 ㉮와, 80 °C 국물을 부었다 식힌 김치 ㉰는 둘 다 익지 않았습니다. 두 통을 20 °C 실온으로 옮기면 각각 어떻게 될지 예상하고, 효소의 성질을 근거로 설명하세요.",
      model: "㉮는 실온으로 옮기면 다시 빠르게 익는다. 낮은 온도에서는 효소가 변성되지 않고 일하는 속도만 아주 느려졌기 때문에 온도가 최적 온도(30 °C)에 가까워지면 다시 잘 일한다. ㉰는 실온으로 옮겨도 익지 않는다. 80 °C 열에 효소(단백질)의 접힌 모양이 풀려 변성되었고, 변성은 온도를 내려도 되돌아오지 않아 기질이 들어갈 홈이 없기 때문이다.",
      rubric: ["㉮는 다시 익고 ㉰는 익지 않는다고 바르게 예상했다", "㉮는 낮은 온도에서 효소가 느려졌을 뿐(변성되지 않음)이라고 설명했다", "㉰는 높은 열로 효소(단백질)가 변성되어 되돌아오지 않는다고 설명했다"] }
  ]
};
</script>
