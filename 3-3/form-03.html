<script>
/* 형성평가 — 통합과학1 Ⅲ-3 03 유전정보의 흐름(유전자 · 전사 · 번역 · 코돈 · 중심 원리 · 돌연변이). 서열과 값은 단원 화면(사람 헤모글로빈 β 유전자 앞부분)과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학1", unit: "Ⅲ-3 생명 시스템", part: "03 유전정보의 흐름",
  std: ["10통과1-03-06"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "세포 안에서 유전 정보가 흐르는 과정에 대한 설명으로 옳은 것은?",
      opts: ["번역은 핵 속에서 DNA를 본떠 mRNA를 만드는 과정이다", "전사는 핵 속에서, 번역은 세포질의 리보솜에서 일어난다", "단백질의 정보가 거꾸로 DNA로 옮겨지는 것이 중심 원리이다", "리보솜은 DNA를 직접 읽어 아미노산을 잇는다"],
      a: 1, why: "DNA를 본떠 mRNA를 만드는 전사는 핵 속에서, mRNA를 읽어 아미노산을 잇는 번역은 세포질의 리보솜에서 일어납니다. 정보는 DNA → RNA → 단백질 한 방향(중심 원리)으로 흐릅니다." },
    { lv: "기본", type: "short", ref: 6,
      q: "리보솜은 mRNA를 세 글자씩 끊어 읽고, 그 세 글자가 아미노산 하나를 지정합니다. 이 mRNA의 염기 3개 묶음을 무엇이라고 할까요?",
      a: ["코돈", "codon"], why: "코돈입니다. 예를 들어 AUG는 메싸이오닌, GAG는 글루탐산을 지정합니다." },
    { lv: "기본", type: "mc", ref: 7,
      q: "헤모글로빈 β 유전자를 전사해 만든 RNA에 대한 설명으로 옳은 것은?",
      opts: ["사람 DNA 약 30억 염기쌍이 모두 한 RNA로 옮겨진 것이다", "DNA 전체의 절반쯤 되는 길이이다", "약 1,600 염기쌍인 유전자 한 토막을 옮긴 것으로 DNA에 비해 매우 짧다", "전사가 끝나면 원래 DNA는 RNA로 바뀌어 없어진다"],
      a: 2, why: "전사는 필요한 유전자 한 부분만 RNA로 옮깁니다. β 유전자는 DNA 전체의 약 200만 분의 1이고, 전사가 끝나도 DNA는 그대로 남습니다." },
    { lv: "발전", type: "short", ref: 5,
      q: "DNA 주형 가닥의 염기 서열이 TACGGA일 때, 전사되어 만들어지는 mRNA의 염기 서열을 쓰세요.",
      a: ["AUGCCU", "AUG CCU", "AUG-CCU"], why: "짝은 A → U, T → A, G → C, C → G입니다. RNA에는 T 대신 유라실(U)이 들어가므로 TAC → AUG, GGA → CCU, 곧 AUGCCU입니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "헤모글로빈 β 유전자의 7번째 코돈 자리에서 DNA 주형 가닥이 CTC(mRNA 코돈 GAG, 글루탐산)입니다. 〈보기〉의 코돈표를 보고, 주형 가닥의 첫 글자 C가 A로 바뀌었을 때 일어나는 일로 옳은 것은?",
      box: "GAG · GAA → 글루탐산(Glu) &nbsp;|&nbsp; GUG → 발린(Val) &nbsp;|&nbsp; UAG · UAA · UGA → 정지",
      opts: ["mRNA 코돈이 GUG가 되어 발린이 붙는다", "mRNA 코돈이 GAA가 되어 아미노산 서열은 그대로다", "mRNA 코돈이 UAG(정지 코돈)가 되어 사슬이 6개에서 끊긴다", "주형 가닥이 바뀌어도 mRNA는 바뀌지 않는다"],
      a: 2, why: "주형 ATC를 본뜨면 mRNA는 UAG가 됩니다. UAG는 아미노산을 지정하지 않는 정지 코돈이라, 앞의 6개(Met-Val-His-Leu-Thr-Pro)까지만 이어지고 번역이 끝납니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "헤모글로빈 β 사슬은 아미노산 146개로 되어 있습니다. 이 사슬의 정보를 담은 mRNA 부분의 염기 수로 옳은 것은? (정지 코돈 하나 포함, 번역 뒤 떨어져 나가는 맨 앞 메싸이오닌은 생각하지 않음)",
      opts: ["146개", "292개", "438개", "441개"],
      a: 3, why: "코돈 하나(염기 3개)가 아미노산 하나를 지정하므로 146 × 3 = 438개, 여기에 번역을 끝내는 정지 코돈 3개를 더해 441개입니다. 단원 화면의 ‘아미노산 정보 441염기’와 같습니다." },
    { lv: "심화", type: "mc", ref: 11,
      q: "낫 모양 적혈구 빈혈증 환자와 정상인을 비교한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. β 유전자의 염기 한 개가 다르다.<br>ㄴ. β 사슬을 이루는 아미노산의 수가 다르다.<br>ㄷ. 헤모글로빈의 성질이 달라져 적혈구 모양까지 바뀐다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "염기 한 개(GAG → GUG)가 바뀌어 아미노산 하나(글루탐산 → 발린)만 다릅니다. 아미노산 수는 146개 그대로입니다(ㄴ 틀림). 달라진 헤모글로빈이 서로 들러붙어 적혈구가 낫 모양으로 굳습니다(ㄷ)." },
    { lv: "심화", type: "essay", ref: 10,
      q: "단원 화면에서 7번째 코돈(주형 CTC)의 염기 한 글자만 바꿨더니, 한 번은 낫 모양 적혈구가 되었고 다른 한 번은 아무 변화가 없었습니다. 각각 어떤 글자 변화였을지 예를 하나씩 들고, 결과가 다른 까닭을 전사와 번역 과정으로 설명하세요.",
      model: "낫 모양 적혈구: 주형의 20번째 T가 A로 바뀌면(CTC → CAC) 전사된 mRNA 코돈이 GAG에서 GUG가 되고, 번역에서 글루탐산 대신 발린이 붙어 헤모글로빈이 달라진다. 변화 없음: 21번째 C가 T로 바뀌면(CTC → CTT) mRNA 코돈이 GAA가 되는데, GAA도 GAG처럼 글루탐산을 지정하므로 아미노산 서열과 단백질이 그대로다. 염기 변화는 전사로 코돈 변화로 이어지지만, 같은 아미노산을 지정하는 코돈이 여럿 있어서 결과가 달라진다.",
      rubric: ["두 경우의 글자 변화와 그에 따른 mRNA 코돈 변화를 바르게 들었다", "낫 모양은 번역에서 다른 아미노산(발린)이 붙어 단백질이 달라진 것이라고 설명했다", "변화가 없는 까닭을 같은 아미노산을 지정하는 코돈이 여럿이기 때문이라고 설명했다"] }
  ]
};
